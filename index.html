<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>VYVE Command Centre</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="assets/tokens.css"/>
  <link rel="stylesheet" href="assets/shell.css"/>
  <link rel="stylesheet" href="assets/components.css"/>
</head>
<body>

  <!-- Login overlay (UI only; auth wiring deferred until Dean provides anon key) -->
  <div id="login" style="display:none">
    <div class="card">
      <div class="brand-block">
        <h1>VYVE</h1>
        <p>Command Centre</p>
      </div>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="email" placeholder="you@vyvehealth.co.uk"/>
      <button class="primary" id="login-submit" type="button">Send magic link</button>
      <p class="note">Internal access only. Pending auth wiring.</p>
    </div>
  </div>

  <!-- App shell -->
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-title">VYVE</div>
        <div class="brand-sub">Command Centre</div>
      </div>
      <nav id="sidebar-nav"><!-- populated by lib/router.js --></nav>
      <div class="sidebar-footer">
        <div class="email" id="user-email">—</div>
        <button id="signout">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="crumbs">
          <span class="crumb">VYVE</span>
          <span>/</span>
          <span class="crumb current" id="crumb-page">—</span>
        </div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
      <div class="content" id="page-slot">
        <div class="empty"><span class="spinner"></span><h3>Loading</h3></div>
      </div>
    </main>
  </div>

  <!-- Runtime configuration. Settings page can override these at runtime. -->
  <script>
    window.VYVE_CONFIG = {
      supabase: {
        url: 'https://ixjfklpckgxrwjlfsaaz.supabase.co',
        anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4amZrbHBja2d4cndqbGZzYWF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNjY0OTUsImV4cCI6MjA5MDY0MjQ5NX0.to0pwmP-F1g93hb-Fbbq4BZUPkJ4KAGEIFwDtn4whCg' // public anon key — safe to commit (Dean confirmed, also in portal auth.js)
      },
      make: {
        base: 'https://eu1.make.com/api/v2',
        token: '',
        stores: {} // mapping of logical key -> Make data-store id
      }
    };
  </script>

  <!-- Supabase JS (for when auth is wired; harmless to load early) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>

  <!-- Config + libs (order matters: config -> deps -> router) -->
  <script src="assets/sidebar-config.js"></script>
  <script src="lib/ui.js"></script>
  <script src="lib/supabase.js"></script>
  <script src="lib/make.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/router.js"></script>
</body>
</html>
