<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>VYVE Command Centre</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="assets/tokens.css"/>
  <link rel="stylesheet" href="assets/shell.css"/>
  <link rel="stylesheet" href="assets/components.css"/>
</head>
<body>

  <!-- Login overlay (UI only in commit 1 - auth wiring deferred pending Dean) -->
  <div id="login">
    <div class="card">
      <div class="brand-block">
        <h1>VYVE</h1>
        <p>Command Centre</p>
      </div>
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="email" placeholder="you@vyvehealth.co.uk"/>
      <button class="primary" id="login-submit" type="button">Send magic link</button>
      <p class="note">Internal access only. Pending auth wiring.</p>
    </div>
  </div>

  <!-- App shell (hidden until auth resolves; revealed by lib/auth.js or lib/router.js bootstrap) -->
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-title">VYVE</div>
        <div class="brand-sub">Command Centre</div>
      </div>
      <nav id="sidebar-nav"><!-- populated by sidebar-config.js + router.js --></nav>
      <div class="sidebar-footer">
        <div class="email" id="user-email">&mdash;</div>
        <button id="signout">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="crumbs">
          <span class="crumb">VYVE</span>
          <span>/</span>
          <span class="crumb current" id="crumb-page">&mdash;</span>
        </div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
      <div class="content" id="page-slot">
        <!-- pages/*.html partials injected here by lib/router.js (commit 2) -->
        <div class="empty">
          <span class="icon">&middot;&middot;&middot;</span>
          <h3>Loading shell</h3>
          <p>Router not yet loaded. Commit 2 wires this up.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Sidebar config is plain data, safe to load in commit 1.
       Other lib/*.js files arrive in commit 2. -->
  <script src="assets/sidebar-config.js"></script>

  <!-- Minimal bootstrap so the shell paints during commit-1-only state.
       This is fully replaced by lib/router.js in commit 2. -->
  <script>
    (function bootstrapCommit1(){
      // Render sidebar from VYVE_NAV so people can at least see structure.
      var nav = document.getElementById('sidebar-nav');
      if (!nav || !window.VYVE_NAV) return;
      var html = '';
      window.VYVE_NAV.forEach(function(section){
        html += '<div class="nav-section">';
        html += '<div class="nav-section-label">' + section.section + '</div>';
        section.items.forEach(function(item){
          var icon = (window.VYVE_ICONS && window.VYVE_ICONS[item.icon]) || '';
          html += '<div class="nav-item" data-page="' + item.slug + '">' + icon + '<span>' + item.label + '</span></div>';
        });
        html += '</div>';
      });
      nav.innerHTML = html;

      // Date in topbar.
      var d = new Date();
      var fmt = d.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
      var el = document.getElementById('topbar-date');
      if (el) el.textContent = fmt;

      // Reveal app without auth (login overlay covers it until commit 2 router takes over).
      // For commit-1-only state we hide login so the shell is inspectable.
      var login = document.getElementById('login');
      var app = document.getElementById('app');
      if (login) login.style.display = 'none';
      if (app) app.classList.add('ready');
    })();
  </script>
</body>
</html>
