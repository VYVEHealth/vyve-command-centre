  <!-- Login overlay (UI only; auth wiring deferred until Dean provides anon key) -->

      <label for="login-email">Email</label>

    </div>
  </div>

  <!-- App shell -->

    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <main class="main">
      <div class="topbar">
        <button id="sidebar-toggle" type="button" aria-label="Toggle navigation" class="sidebar-toggle">

        <div class="crumbs">
          <span class="crumb">VYVE</span>
          <span>/</span>
          <span class="crumb current" id="crumb-page">—</span>
        </div>
        <div class="topbar-date" id="topbar-date"></div>
      </div>
      <div class="content" id="page-slot">
        <div class="empty"><span class="spinner"></span><h3>Loading</h3></div>
      </div>
    </main>
  </div>

  <script>
    // Mobile sidebar toggle + swipe-to-close gesture
    (function(){
      function $(s){ return document.querySelector(s); }
      var sb = $('#sidebar');
      var ov = $('#sidebar-overlay');
      var btn = $('#sidebar-toggle');
      function open(){ if (sb) sb.classList.add('open'); if (ov) ov.classList.add('open'); }
      function close(){ if (sb) sb.classList.remove('open'); if (ov) ov.classList.remove('open'); }
      function toggle(){ if (sb && sb.classList.contains('open')) close(); else open(); }
      if (btn) btn.addEventListener('click', toggle);
      if (ov)  ov.addEventListener('click', close);
      window.addEventListener('vyve:page', close);
      document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });

      // Swipe gestures: left-edge swipe-right opens the drawer; on drawer, swipe-left closes
      var touchStartX = 0, touchStartY = 0, touchTracking = false;
      function isMobile(){ return window.innerWidth <= 900; }

      document.addEventListener('touchstart', function(e){
        if (!isMobile()) return;
        var t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        // Track if starting from left edge (open) or on the drawer (close)
        if (touchStartX < 24 && !sb.classList.contains('open')) touchTracking = 'open';
        else if (sb.classList.contains('open') && touchStartX < 320) touchTracking = 'close';
        else touchTracking = false;
      }, { passive: true });

      document.addEventListener('touchend', function(e){
        if (!touchTracking) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - touchStartX;
        var dy = Math.abs(t.clientY - touchStartY);
        // Require a primarily horizontal swipe of at least 60px
        if (Math.abs(dx) > 60 && dy < 80){
          if (touchTracking === 'open' && dx > 0) open();
          else if (touchTracking === 'close' && dx < 0) close();
        }
        touchTracking = false;
      }, { passive: true });
    })();
  </script>
</body>
