<div class="page active" id="page-marketing">
  <div class="page-hero">
    <div class="eyebrow">Brand & Reach</div>
    <h1 class="page-title">Marketing</h1>
    <p class="page-sub">Brand, content, social, podcast, performance. The full marketing engine, with live signal.</p>
  </div>

  <div class="hub-tiles" id="hub-marketing-tiles"></div>
</div>

<style>
  .hub-tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 8px;
  }
  @media (max-width: 1100px) { .hub-tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .hub-tiles { grid-template-columns: 1fr; } }

  .hub-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 22px 22px 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
    text-decoration: none;
    color: inherit;
    position: relative;
    min-height: 156px;
  }
  .hub-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--vyve-teal-pale);
    color: inherit;
  }
  .hub-tile .tile-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .hub-tile .tile-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--r-md);
    background: var(--vyve-teal-pale);
    color: var(--vyve-teal);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hub-tile .tile-icon svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hub-tile .tile-badge {
    font-size: var(--fs-xxs);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    flex-shrink: 0;
  }
  .hub-tile .tile-label {
    font-family: var(--font-head);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1.2;
    margin-top: 2px;
  }
  .hub-tile .tile-metric-row {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  .hub-tile .tile-primary {
    font-family: var(--font-head);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1;
  }
  .hub-tile .tile-secondary {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-align: right;
    line-height: 1.3;
    max-width: 50%;
  }
  .hub-tile .tile-arrow {
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity var(--t-fast), transform var(--t-fast);
  }
  .hub-tile:hover .tile-arrow {
    opacity: 1;
    transform: translateX(2px);
    color: var(--vyve-teal);
  }
</style>

<script>
(function(){
  if (!window.VYVE_DATA) { console.error('[hub-marketing] VYVE_DATA not loaded'); return; }
  var D = window.VYVE_DATA;
  var ICONS = window.VYVE_ICONS || {};
  var tiles = [{"slug": "content", "label": "Content", "icon": "edit", "primary": "D.content.inFlight().length", "secondary": "'in flight  \\u00b7  ' + D.content.publishedLast30().length + ' published 30d'", "badge": null}, {"slug": "social-blueprint", "label": "Social Blueprint", "icon": "compass", "primary": "'\\u2014'", "secondary": "'Plan & playbook'", "badge": "'<span class=\"tile-badge badge-teal\">live</span>'"}, {"slug": "performance", "label": "Performance", "icon": "bar-chart", "primary": "D.fmt(D.performance.totalReach(30))", "secondary": "(function(){ var g = D.performance.reachGrowth30d('linkedin'); return g != null ? (g >= 0 ? '+' : '') + g + '% LinkedIn 30d' : '30-day reach'; })()", "badge": null}, {"slug": "podcast", "label": "Podcast", "icon": "mic", "primary": "D.podcast.published().length", "secondary": "D.podcast.inProduction().length + ' in production'", "badge": null}, {"slug": "brand", "label": "Brand", "icon": "droplet", "primary": "'\\u2014'", "secondary": "'Identity, voice, assets'", "badge": null}];
  var arrow = '<svg class="tile-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  function safe(fn){ try { return fn(); } catch(e){ console.warn('tile metric error', e); return ''; } }

  function renderTile(t){
    var icon = ICONS[t.icon] || '';
    var primary = safe(function(){ return eval(t.primary); }) || '—';
    var secondary = safe(function(){ return eval(t.secondary); }) || '';
    var badge = t.badge ? safe(function(){ return eval(t.badge); }) : '';
    return '<a class="hub-tile" href="#/' + t.slug + '">' +
      '<div class="tile-head">' +
        '<div class="tile-icon">' + icon + '</div>' +
        (badge || '') +
      '</div>' +
      '<div class="tile-label">' + t.label + '</div>' +
      '<div class="tile-metric-row">' +
        '<div class="tile-primary">' + primary + '</div>' +
        '<div class="tile-secondary">' + secondary + '</div>' +
      '</div>' +
      arrow +
    '</a>';
  }

  document.getElementById('hub-marketing-tiles').innerHTML = tiles.map(renderTile).join('');
})();
</script>
