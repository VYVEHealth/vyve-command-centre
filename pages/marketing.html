<div class="page active" id="page-marketing">
  <div class="page-hero">
    <div class="eyebrow">Brand & Reach</div>
    <h1 class="page-title">Marketing</h1>
    <p class="page-sub">Brand, content, social, podcast, performance. The full marketing engine, with live signal.</p>
  </div>

  <div class="hub-tiles" id="hub-marketing-tiles"></div>

  <!-- Live signal: this week's posts + channel reach -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px">
    <div class="card">
      <div class="card-header"><div class="card-title">This week’s content</div><div class="card-sub" id="mkt-this-week-sub">Loading…</div></div>
      <div id="mkt-this-week" class="card-body"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Channel reach (30d)</div><div class="card-sub">By platform</div></div>
      <div id="mkt-channels" class="card-body" style="padding:18px 22px"></div>
    </div>
  </div>
</div>

<style>
  .hub-tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 8px;
  }
  @media (max-width: 1100px) { .hub-tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .hub-tiles { grid-template-columns: 1fr; } }

  .hub-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 22px 22px 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
    text-decoration: none;
    color: inherit;
    position: relative;
    min-height: 156px;
  }
  .hub-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--vyve-teal-pale);
    color: inherit;
  }
  .hub-tile .tile-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .hub-tile .tile-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--r-md);
    background: var(--vyve-teal-pale);
    color: var(--vyve-teal);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hub-tile .tile-icon svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hub-tile .tile-badge {
    font-size: var(--fs-2xs);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    flex-shrink: 0;
  }
  .hub-tile .tile-label {
    font-family: var(--font-head);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1.2;
    margin-top: 2px;
  }
  .hub-tile .tile-metric-row {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  .hub-tile .tile-primary {
    font-family: var(--font-head);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1;
  }
  .hub-tile .tile-secondary {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-align: right;
    line-height: 1.3;
    max-width: 50%;
  }
  .hub-tile .tile-arrow {
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity var(--t-fast), transform var(--t-fast);
  }
  .hub-tile:hover .tile-arrow {
    opacity: 1;
    transform: translateX(2px);
    color: var(--vyve-teal);
  }
</style>

<script>
(function(){
  if (!window.VYVE_DATA) { console.error('[hub-marketing] VYVE_DATA not loaded'); return; }
  var D = window.VYVE_DATA;
  var ICONS = window.VYVE_ICONS || {};
  var tiles = [{"slug": "content", "label": "Content", "icon": "edit", "primary": "D.content.inFlight().length", "secondary": "'in flight  \\u00b7  ' + D.content.publishedLast30().length + ' published 30d'", "badge": null}, {"slug": "social-blueprint", "label": "Social Blueprint", "icon": "compass", "primary": "'\\u2014'", "secondary": "'Plan & playbook'", "badge": "'<span class=\"tile-badge badge-teal\">live</span>'"}, {"slug": "performance", "label": "Performance", "icon": "bar-chart", "primary": "D.fmt(D.performance.totalReach(30))", "secondary": "(function(){ var g = D.performance.reachGrowth30d('linkedin'); return g != null ? (g >= 0 ? '+' : '') + g + '% LinkedIn 30d' : '30-day reach'; })()", "badge": null}, {"slug": "podcast", "label": "Podcast", "icon": "mic", "primary": "D.podcast.published().length", "secondary": "D.podcast.inProduction().length + ' in production'", "badge": null}, {"slug": "brand", "label": "Brand", "icon": "droplet", "primary": "'\\u2014'", "secondary": "'Identity, voice, assets'", "badge": null}];
  var arrow = '<svg class="tile-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  function safe(fn){ try { return fn(); } catch(e){ console.warn('tile metric error', e); return ''; } }

  function renderTile(t){
    var icon = ICONS[t.icon] || '';
    var primary = safe(function(){ return eval(t.primary); }) || '—';
    var secondary = safe(function(){ return eval(t.secondary); }) || '';
    var badge = t.badge ? safe(function(){ return eval(t.badge); }) : '';
    return '<a class="hub-tile" href="#/' + t.slug + '">' +
      '<div class="tile-head">' +
        '<div class="tile-icon">' + icon + '</div>' +
        (badge || '') +
      '</div>' +
      '<div class="tile-label">' + t.label + '</div>' +
      '<div class="tile-metric-row">' +
        '<div class="tile-primary">' + primary + '</div>' +
        '<div class="tile-secondary">' + secondary + '</div>' +
      '</div>' +
      arrow +
    '</a>';
  }

  document.getElementById('hub-marketing-tiles').innerHTML = tiles.map(renderTile).join('');

  // ---- This week\u2019s content ----
  function renderThisWeek(){
    var all = D.content.all();
    var now = Date.now();
    var weekEnd = now + 7*86400000;
    var thisWeek = all.filter(function(c){
      var p = D.parseDate(c.publish_date || c.scheduled_for);
      return p && p.getTime() >= now && p.getTime() <= weekEnd;
    }).sort(function(a,b){
      return D.parseDate(a.publish_date || a.scheduled_for) - D.parseDate(b.publish_date || b.scheduled_for);
    });
    var sub = document.getElementById('mkt-this-week-sub');
    if (!thisWeek.length){
      sub.textContent = 'Nothing scheduled';
      document.getElementById('mkt-this-week').innerHTML = '<div class="empty" style="padding:24px 22px"><h3>Nothing scheduled</h3><p>Add upcoming posts on the Content page. They\u2019ll surface here.</p></div>';
      return;
    }
    sub.textContent = thisWeek.length + ' post' + (thisWeek.length === 1 ? '' : 's') + ' planned';
    document.getElementById('mkt-this-week').innerHTML = thisWeek.slice(0, 6).map(function(c){
      var p = D.parseDate(c.publish_date || c.scheduled_for);
      return '<a class="list-row" href="#/content" style="padding:12px 22px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px">' +
        '<div class="list-row-main">' +
          '<div class="list-row-title">' + (c.title || c.headline || 'Untitled') + '</div>' +
          '<div class="list-row-sub">' + (c.channel || '') + (c.owner ? ' \u00b7 ' + c.owner : '') + '</div>' +
        '</div>' +
        '<div class="list-row-meta" style="font-size:11px;color:var(--text-muted)">' + (p ? D.fmtDate(p) : '') + '</div>' +
      '</a>';
    }).join('');
  }

  // ---- Channel reach bars ----
  function renderChannels(){
    var channels = ['linkedin', 'instagram', 'facebook', 'twitter'];
    var rows = channels.map(function(ch){
      var reach = D.performance.latestReachByChannel ? D.performance.latestReachByChannel(ch) : 0;
      var growth = D.performance.reachGrowth30d ? D.performance.reachGrowth30d(ch) : null;
      return { channel: ch, reach: reach || 0, growth: growth };
    });
    rows.sort(function(a, b){ return b.reach - a.reach; });
    var max = Math.max.apply(null, rows.map(function(r){ return r.reach; }).concat([1]));
    if (!rows.some(function(r){ return r.reach > 0; })){
      document.getElementById('mkt-channels').innerHTML = '<div class="empty" style="padding:14px 0"><p>No reach data yet. Add performance entries to see channel-by-channel reach here.</p></div>';
      return;
    }
    document.getElementById('mkt-channels').innerHTML = rows.map(function(r){
      var pct = max > 0 ? (r.reach / max) * 100 : 0;
      var growthLabel = r.growth != null ? ((r.growth >= 0 ? '+' : '') + r.growth + '%') : '';
      var growthColor = r.growth != null && r.growth >= 0 ? 'var(--success)' : 'var(--danger)';
      return '<div style="margin-bottom:14px">' +
        '<div style="display:flex;align-items:baseline;justify-content:space-between;font-size:13px;margin-bottom:4px">' +
          '<div style="text-transform:capitalize;font-weight:500;color:var(--text)">' + r.channel + '</div>' +
          '<div style="display:flex;gap:10px;align-items:baseline">' +
            '<span style="font-weight:600">' + D.fmt(r.reach) + '</span>' +
            (growthLabel ? '<span style="font-size:11px;color:' + growthColor + ';font-weight:600">' + growthLabel + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div style="height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden"><div style="width:' + pct.toFixed(1) + '%;height:100%;background:var(--vyve-teal);border-radius:3px"></div></div>' +
      '</div>';
    }).join('');
  }

  renderThisWeek();
  renderChannels();
})();
</script>
