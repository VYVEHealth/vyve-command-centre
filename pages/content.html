<!-- =====================================================================
     VYVE Command Centre — Content (PM-758, CC overhaul Phase 3)
     cc_posts planner. CHECK vocabularies: status draft/needs_review/approved/posted,
     pillar Physical/Mental/Social/Business. Posting itself lives in Metricool
     (nav external link) — this is the plan/approve board.
     ===================================================================== -->
<style>
.ct-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.ct-eyebrow{font-family:var(--font-mono);font-size:var(--fs-2xs);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.ct-h1{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.015em}
.ct-meta{font-size:var(--fs-sm);color:var(--text-muted)}
.ct-btn{border:0;border-radius:var(--btn-radius);padding:9px 16px;font-size:var(--fs-sm);font-weight:600;cursor:pointer;font-family:var(--font-body)}
.ct-btn.primary{background:var(--accent);color:var(--on-accent)}
.ct-btn.primary:hover{background:var(--accent-hover)}
.ct-btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
.ct-btn.danger{background:var(--danger-pale);color:var(--danger)}
.ct-stage{margin-bottom:22px}
.ct-stage-h{font-family:var(--font-mono);font-size:var(--fs-2xs);letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.ct-stage-h b{color:var(--text-muted);font-weight:500}
.ct-stage-h::after{content:"";flex:1;height:1px;background:var(--border)}
.ct-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ct-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius);padding:13px 15px;box-shadow:var(--shadow-md);cursor:pointer;transition:border-color .15s}
.ct-card:hover{border-color:var(--accent)}
.ct-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.ct-platform{font-family:var(--font-mono);font-size:var(--fs-2xs);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-pale);border-radius:var(--r-sm);padding:2px 7px}
.ct-pillar{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.ct-title{font-size:var(--fs-base);font-weight:700}
.ct-copy{margin-top:5px;font-size:var(--fs-xs);color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ct-date{margin-top:8px;font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-dim)}
.ct-empty{padding:14px;border:1px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--text-dim);font-size:var(--fs-xs);text-align:center}
.ct-error{background:var(--danger-pale);border-radius:var(--r-lg);padding:12px 16px;color:var(--danger);font-size:var(--fs-sm);margin-bottom:14px;display:none}
.ct-overlay{position:fixed;inset:0;background:rgba(4,12,12,.6);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
.ct-modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--modal-radius) var(--modal-radius) 0 0;max-width:100%;width:100%;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto}
.ct-mh{padding:18px 20px 0}.ct-mh h3{font-size:var(--fs-md);font-weight:700}
.ct-mb{padding:12px 20px 4px}
.ct-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.ct-field label{font-family:var(--font-mono);font-size:var(--fs-2xs);letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.ct-in{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--input-radius);padding:9px 12px;font-size:var(--fs-sm);color:var(--text);font-family:var(--font-body);width:100%}
.ct-in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.ct-in{min-height:90px;resize:vertical}
.ct-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ct-mf{display:flex;justify-content:space-between;gap:10px;padding:16px 20px 18px}
.ct-mf-right{display:flex;gap:10px}
@media(min-width:640px){.ct-overlay{align-items:center;padding:18px}.ct-modal{border-radius:var(--modal-radius);max-width:480px}}
</style>

<div class="ct-head">
  <div>
    <div class="ct-eyebrow">Run the Business</div>
    <div class="ct-h1">Content</div>
    <div class="ct-meta" id="ct-meta">Loading…</div>
  </div>
  <button class="ct-btn primary" id="ct-add">New post</button>
</div>
<div class="ct-error" id="ct-error"></div>
<div id="ct-board"></div>

<script>
(function(){
  var STATUSES = [['draft','Drafts'],['needs_review','Needs review'],['approved','Approved'],['posted','Posted']];
  var PILLARS = ['Physical','Mental','Social','Business'];
  var PLATFORMS = ['LinkedIn','Instagram','Facebook','X','TikTok','YouTube','Blog','Other'];
  var posts = [];
  function el(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function err(m){ var e=el('ct-error'); e.style.display='block'; e.textContent=m; }
  function sb(){ return window.VYVE_SUPABASE && window.VYVE_SUPABASE.client && window.VYVE_SUPABASE.client; }
  function opts(list, sel){ return list.map(function(s){var val=Array.isArray(s)?s[0]:s,lab=Array.isArray(s)?s[1]:s;return '<option value="'+val+'"'+(sel===val?' selected':'')+'>'+lab+'</option>'}).join(''); }

  function render(){
    var awaiting = posts.filter(function(p){return p.status==='needs_review'}).length;
    var ready = posts.filter(function(p){return p.status==='approved'}).length;
    el('ct-meta').textContent = posts.length + ' posts · ' + awaiting + ' awaiting review · ' + ready + ' ready to publish';
    el('ct-board').innerHTML = STATUSES.map(function(st){
      var rows = posts.filter(function(p){return p.status===st[0]});
      if (!rows.length && st[0]==='posted') return '';
      var cards = rows.length ? rows.map(function(p){
        return '<div class="ct-card" data-id="'+p.id+'">'+
          '<div class="ct-top"><span class="ct-platform">'+esc(p.platform||'—')+'</span><span class="ct-pillar">'+esc(p.pillar||'')+'</span></div>'+
          '<div class="ct-title">'+esc(p.title||'(untitled)')+'</div>'+
          (p.copy?'<div class="ct-copy">'+esc(p.copy)+'</div>':'')+
          (p.scheduled_date?'<div class="ct-date">Scheduled '+esc(p.scheduled_date)+'</div>':'')+
        '</div>';
      }).join('') : '<div class="ct-empty">Nothing in '+st[1].toLowerCase()+'</div>';
      return '<div class="ct-stage"><div class="ct-stage-h">'+st[1]+' <b>'+rows.length+'</b></div><div class="ct-cards">'+cards+'</div></div>';
    }).join('');
    document.querySelectorAll('.ct-card').forEach(function(c){
      c.addEventListener('click', function(){ openModal(posts.find(function(p){return p.id===c.getAttribute('data-id')})); });
    });
  }

  async function load(){
    var client = sb();
    if (!client){ err('Supabase client unavailable — reload.'); return; }
    var res = await client.from('cc_posts').select('*').order('updated_at',{ascending:false}).limit(200);
    if (res.error){ err('Content failed to load: '+res.error.message); return; }
    posts = res.data||[];
    render();
  }

  var overlay=null;
  function closeModal(){ if(overlay){overlay.remove();overlay=null;} }
  function openModal(p){
    closeModal();
    var isNew = !p; p = p||{};
    overlay = document.createElement('div');
    overlay.className='ct-overlay';
    overlay.innerHTML =
      '<div class="ct-modal"><div class="ct-mh"><h3>'+(isNew?'New post':'Edit post')+'</h3></div>'+
      '<div class="ct-mb">'+
        '<div class="ct-field"><label>Title</label><input class="ct-in" id="p-title" value="'+esc(p.title||'')+'"></div>'+
        '<div class="ct-two">'+
          '<div class="ct-field"><label>Platform</label><select class="ct-in" id="p-platform">'+opts(PLATFORMS,p.platform)+'</select></div>'+
          '<div class="ct-field"><label>Pillar</label><select class="ct-in" id="p-pillar">'+opts(PILLARS,p.pillar)+'</select></div>'+
        '</div>'+
        '<div class="ct-two">'+
          '<div class="ct-field"><label>Status</label><select class="ct-in" id="p-status">'+opts(STATUSES,p.status)+'</select></div>'+
          '<div class="ct-field"><label>Scheduled date</label><input class="ct-in" id="p-date" type="date" value="'+esc(p.scheduled_date||'')+'"></div>'+
        '</div>'+
        '<div class="ct-field"><label>Copy</label><textarea class="ct-in" id="p-copy">'+esc(p.copy||'')+'</textarea></div>'+
      '</div>'+
      '<div class="ct-mf">'+(isNew?'<span></span>':'<button class="ct-btn danger" id="p-delete">Delete</button>')+
      '<div class="ct-mf-right"><button class="ct-btn secondary" id="p-cancel">Cancel</button><button class="ct-btn primary" id="p-save">Save</button></div></div></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if(e.target===overlay) closeModal(); });
    overlay.querySelector('#p-cancel').addEventListener('click', closeModal);
    overlay.querySelector('#p-save').addEventListener('click', async function(){
      var title = overlay.querySelector('#p-title').value.trim();
      if (!title){ overlay.querySelector('#p-title').focus(); return; }
      var status = overlay.querySelector('#p-status').value;
      var payload = {
        title: title,
        platform: overlay.querySelector('#p-platform').value,
        pillar: overlay.querySelector('#p-pillar').value,
        status: status,
        scheduled_date: overlay.querySelector('#p-date').value || null,
        copy: overlay.querySelector('#p-copy').value.trim() || null,
        updated_at: new Date().toISOString()
      };
      if (status === 'posted' && !p.published_at) payload.published_at = new Date().toISOString();
      var btn=this; btn.disabled=true; btn.textContent='Saving…';
      var client = sb(); var res;
      if (isNew){
        try { var s = await client.auth.getSession(); payload.created_by = (s.data.session && s.data.session.user.email) || null; } catch(_){}
        res = await client.from('cc_posts').insert(payload);
      } else {
        res = await client.from('cc_posts').update(payload).eq('id', p.id);
      }
      if (res.error){ btn.disabled=false; btn.textContent='Save'; err('Save failed: '+res.error.message); return; }
      closeModal(); el('ct-error').style.display='none'; load();
    });
    var del = overlay.querySelector('#p-delete');
    if (del) del.addEventListener('click', async function(){
      if (!confirm('Delete this post? This cannot be undone.')) return;
      var res = await sb().from('cc_posts').delete().eq('id', p.id);
      if (res.error){ err('Delete failed: '+res.error.message); return; }
      closeModal(); load();
    });
  }

  el('ct-add').addEventListener('click', function(){ openModal(null); });
  load();
})();
</script>
