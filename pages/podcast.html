<!-- =====================================================================
     VYVE Command Centre — Podcast (PM-758, CC overhaul Phase 3)
     cc_episodes tracker for The VYVE Podcast. CHECK: planned/recorded/published.
     ===================================================================== -->
<style>
.pd-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.pd-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.pd-h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.pd-meta{font-size:13px;color:var(--text-muted)}
.pd-btn{border:0;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.pd-btn.primary{background:var(--accent);color:var(--on-accent)}
.pd-btn.primary:hover{background:var(--accent-hover)}
.pd-btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
.pd-btn.danger{background:var(--danger-pale);color:var(--danger)}
.pd-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md);overflow-x:auto}
.pd-table{width:100%;border-collapse:collapse}
.pd-table th{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);text-align:left;padding:10px 16px;border-bottom:1px solid var(--border)}
.pd-table td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.pd-table td.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12px;color:var(--text-dim)}
.pd-table tbody tr:last-child td{border-bottom:0}
.pd-table tbody tr{cursor:pointer;transition:background .12s}
.pd-table tbody tr:hover{background:var(--accent-pale)}
.pd-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px}
.pd-pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pd-pill.planned{background:var(--surface-2);color:var(--text-muted)}
.pd-pill.recorded{background:var(--warning-pale);color:var(--warning)}
.pd-pill.published{background:var(--success-pale);color:var(--success)}
.pd-empty{padding:22px;text-align:center;color:var(--text-muted);font-size:13px}
.pd-error{background:var(--danger-pale);border-radius:12px;padding:12px 16px;color:var(--danger);font-size:13.5px;margin-bottom:14px;display:none}
.pd-overlay{position:fixed;inset:0;background:rgba(4,12,12,.6);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.pd-modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;max-width:440px;width:100%;box-shadow:var(--shadow-lg)}
.pd-mh{padding:18px 20px 0}.pd-mh h3{font-size:16px;font-weight:700}
.pd-mb{padding:12px 20px 4px}
.pd-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.pd-field label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.pd-in{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--text);font-family:var(--font-body);width:100%}
.pd-in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.pd-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pd-mf{display:flex;justify-content:space-between;gap:10px;padding:16px 20px 18px}
.pd-mf-right{display:flex;gap:10px}
@media(max-width:640px){.pd-overlay{padding:0;align-items:flex-end}.pd-modal{max-width:100%;width:100%;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto}}
</style>

<div class="pd-head">
  <div>
    <div class="pd-eyebrow">Run the Business</div>
    <div class="pd-h1">The VYVE Podcast</div>
    <div class="pd-meta" id="pd-meta">Loading…</div>
  </div>
  <button class="pd-btn primary" id="pd-add">Add episode</button>
</div>
<div class="pd-error" id="pd-error"></div>
<div class="pd-card">
  <table class="pd-table">
    <thead><tr><th>#</th><th>Title</th><th>Guest</th><th>Date</th><th>Status</th><th>Notes</th></tr></thead>
    <tbody id="pd-rows"><tr><td colspan="6" class="pd-empty">Loading…</td></tr></tbody>
  </table>
</div>

<script>
(function(){
  var STATUSES = ['planned','recorded','published'];
  var eps = [];
  function el(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function err(m){ var e=el('pd-error'); e.style.display='block'; e.textContent=m; }
  function sb(){ return window.VYVE_SUPABASE && window.VYVE_SUPABASE.client && window.VYVE_SUPABASE.client; }
  function opts(list, sel){ return list.map(function(s){return '<option value="'+s+'"'+(sel===s?' selected':'')+'>'+s+'</option>'}).join(''); }

  function render(){
    var pub = eps.filter(function(e){return e.status==='published'}).length;
    var pipeline = eps.length - pub;
    el('pd-meta').textContent = eps.length ? (pub+' published · '+pipeline+' in the pipeline') : 'No episodes tracked yet';
    var rows = el('pd-rows');
    rows.innerHTML = eps.length ? eps.map(function(e){
      return '<tr data-id="'+e.id+'"><td class="num">'+(e.episode_number!=null?esc(e.episode_number):'—')+'</td>'+
        '<td><b>'+esc(e.title||'(untitled)')+'</b></td><td>'+esc(e.guest||'—')+'</td><td>'+esc(e.episode_date||'—')+'</td>'+
        '<td><span class="pd-pill '+esc(e.status)+'"><i></i>'+esc(e.status)+'</span></td><td>'+esc(e.notes||'')+'</td></tr>';
    }).join('') : '<tr><td colspan="6" class="pd-empty">Nothing tracked yet. The 60+ back-catalogue lives on the podcast page — track new episodes and guests here from planning to publish.</td></tr>';
    rows.querySelectorAll('tr[data-id]').forEach(function(tr){
      tr.addEventListener('click', function(){ openModal(eps.find(function(e){return e.id===tr.getAttribute('data-id')})); });
    });
  }

  async function load(){
    var client = sb();
    if (!client){ err('Supabase client unavailable — reload.'); return; }
    var res = await client.from('cc_episodes').select('*').order('episode_number',{ascending:false,nullsFirst:false});
    if (res.error){ err('Episodes failed to load: '+res.error.message); return; }
    eps = res.data||[];
    render();
  }

  var overlay=null;
  function closeModal(){ if(overlay){overlay.remove();overlay=null;} }
  function openModal(e){
    closeModal();
    var isNew = !e; e = e||{};
    var nextNum = isNew ? (eps.reduce(function(m,x){return Math.max(m, x.episode_number||0)},0) + 1) : e.episode_number;
    overlay = document.createElement('div');
    overlay.className='pd-overlay';
    overlay.innerHTML =
      '<div class="pd-modal"><div class="pd-mh"><h3>'+(isNew?'Add episode':'Edit episode')+'</h3></div>'+
      '<div class="pd-mb">'+
        '<div class="pd-two"><div class="pd-field"><label>Episode #</label><input class="pd-in" id="e-num" type="number" min="1" value="'+(nextNum!=null?esc(nextNum):'')+'"></div>'+
        '<div class="pd-field"><label>Date</label><input class="pd-in" id="e-date" type="date" value="'+esc(e.episode_date||'')+'"></div></div>'+
        '<div class="pd-field"><label>Title</label><input class="pd-in" id="e-title" value="'+esc(e.title||'')+'"></div>'+
        '<div class="pd-field"><label>Guest</label><input class="pd-in" id="e-guest" value="'+esc(e.guest||'')+'"></div>'+
        '<div class="pd-field"><label>Status</label><select class="pd-in" id="e-status">'+opts(STATUSES,e.status)+'</select></div>'+
        '<div class="pd-field"><label>Notes</label><input class="pd-in" id="e-notes" value="'+esc(e.notes||'')+'"></div>'+
      '</div>'+
      '<div class="pd-mf">'+(isNew?'<span></span>':'<button class="pd-btn danger" id="e-delete">Delete</button>')+
      '<div class="pd-mf-right"><button class="pd-btn secondary" id="e-cancel">Cancel</button><button class="pd-btn primary" id="e-save">Save</button></div></div></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(ev){ if(ev.target===overlay) closeModal(); });
    overlay.querySelector('#e-cancel').addEventListener('click', closeModal);
    overlay.querySelector('#e-save').addEventListener('click', async function(){
      var title = overlay.querySelector('#e-title').value.trim();
      if (!title){ overlay.querySelector('#e-title').focus(); return; }
      var numRaw = overlay.querySelector('#e-num').value;
      var payload = {
        episode_number: numRaw===''?null:parseInt(numRaw,10),
        title: title,
        guest: overlay.querySelector('#e-guest').value.trim() || null,
        episode_date: overlay.querySelector('#e-date').value || null,
        status: overlay.querySelector('#e-status').value,
        notes: overlay.querySelector('#e-notes').value.trim() || null,
        updated_at: new Date().toISOString()
      };
      var btn=this; btn.disabled=true; btn.textContent='Saving…';
      var client = sb(); var res;
      if (isNew){
        try { var s = await client.auth.getSession(); payload.created_by = (s.data.session && s.data.session.user.email) || null; } catch(_){}
        res = await client.from('cc_episodes').insert(payload);
      } else {
        res = await client.from('cc_episodes').update(payload).eq('id', e.id);
      }
      if (res.error){ btn.disabled=false; btn.textContent='Save'; err('Save failed: '+res.error.message); return; }
      closeModal(); el('pd-error').style.display='none'; load();
    });
    var del = overlay.querySelector('#e-delete');
    if (del) del.addEventListener('click', async function(){
      if (!confirm('Delete this episode? This cannot be undone.')) return;
      var res = await sb().from('cc_episodes').delete().eq('id', e.id);
      if (res.error){ err('Delete failed: '+res.error.message); return; }
      closeModal(); load();
    });
  }

  el('pd-add').addEventListener('click', function(){ openModal(null); });
  load();
})();
</script>
