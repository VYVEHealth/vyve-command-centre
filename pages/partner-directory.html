<div class="page active" id="page-partner-directory">
  <div class="page-header">
    <div class="hdr-row">
      <div><div class="eyebrow">Partner Space</div><h1 class="page-title">Partners</h1><p class="page-sub">All partners — click to manage</p></div>
    </div>
  </div>

  <div class="tbl-wrap">
    <div class="tbl-filters">
      <div class="search"><input id="pd-search" placeholder="Search partners…"/></div>
      <select id="pd-status" style="padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);color:var(--text);font-size:13px">
        <option value="">All statuses</option>
        <option value="live">Live</option>
        <option value="onboarding">Onboarding</option>
        <option value="applied">Applied</option>
        <option value="vetting">Vetting</option>
        <option value="interview">Interview</option>
        <option value="contract">Contract</option>
        <option value="suspended">Suspended</option>
        <option value="declined">Declined</option>
      </select>
      <select id="pd-pillar" style="padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);color:var(--text);font-size:13px">
        <option value="">All pillars</option>
        <option value="body">Body</option>
        <option value="mind">Mind</option>
        <option value="connect">Connect</option>
      </select>
    </div>
    <table class="tbl">
      <thead><tr><th>Partner</th><th>Pillar</th><th>Status</th><th>Rating</th><th>Rev share</th><th>Verified</th></tr></thead>
      <tbody id="pd-tbody"><tr><td colspan="6"><div class="empty"><span class="spinner"></span><h3>Loading…</h3></div></td></tr></tbody>
    </table>
  </div>

  <!-- Partner detail panel -->
  <div id="pd-panel" style="display:none;position:fixed;top:0;right:0;width:540px;height:100%;background:var(--surface-1);border-left:1px solid var(--border);z-index:200;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.3)">
    <div style="padding:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h2 id="pd-panel-name" style="font-size:17px;font-weight:700;margin:0">—</h2>
        <button onclick="closePdPanel()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;padding:4px">&#x2715;</button>
      </div>

      <!-- Sub-tabs -->
      <div class="subtabs" style="display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);overflow-x:auto">
        <button class="subtab active" data-tab="pd-tab-overview">Overview</button>
        <button class="subtab" data-tab="pd-tab-content">Content</button>
        <button class="subtab" data-tab="pd-tab-members">Members</button>
        <button class="subtab" data-tab="pd-tab-revenue">Revenue</button>
        <button class="subtab" data-tab="pd-tab-settings">Settings</button>
      </div>

      <div id="pd-tab-overview" class="pd-tab-pane"></div>
      <div id="pd-tab-content" class="pd-tab-pane" style="display:none"></div>
      <div id="pd-tab-members" class="pd-tab-pane" style="display:none"></div>
      <div id="pd-tab-revenue" class="pd-tab-pane" style="display:none"></div>
      <div id="pd-tab-settings" class="pd-tab-pane" style="display:none"></div>
    </div>
  </div>
  <div id="pd-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199" onclick="closePdPanel()"></div>
</div>

<style>
.subtab{background:none;border:none;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.subtab.active{color:var(--teal);border-bottom-color:var(--teal)}
.pd-tab-pane{}
.pd-detail-row{margin-bottom:14px}
.pd-detail-label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.pd-detail-val{font-size:13px;line-height:1.5}
.pd-monogram{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
</style>

<script>
(function(){
  var sb, allPartners=[], currentId=null;
  function getClient(){return window.VYVE_CC_SUPABASE||window.ccSupabase;}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function monogram(n){var p=n.replace(/[^a-zA-Z ]/g,' ').split(/\s+/).filter(Boolean);return((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();}
  var PILLAR_COLORS={body:'var(--teal)',mind:'#4a9eba',connect:'#e8a855'};
  var PILLAR_LABELS={body:'Body',mind:'Mind',connect:'Connect'};
  function statusPill(s){var m={live:'badge-green',onboarding:'badge-blue',applied:'badge-amber',vetting:'badge-amber',interview:'badge-amber',contract:'badge-teal',suspended:'badge-red',declined:'badge-grey'};return'<span class="badge '+(m[s]||'badge-grey')+'">'+s+'</span>';}

  function render(){
    var q=(document.getElementById('pd-search').value||'').toLowerCase();
    var st=document.getElementById('pd-status').value;
    var pl=document.getElementById('pd-pillar').value;
    var items=allPartners.filter(function(p){
      if(q&&!(p.name.toLowerCase().includes(q)||p.role_title.toLowerCase().includes(q)))return false;
      if(st&&p.status!==st)return false;
      if(pl&&p.pillar!==pl)return false;
      return true;
    });
    var tbody=document.getElementById('pd-tbody');
    if(!items.length){tbody.innerHTML='<tr><td colspan="6"><div class="empty"><span>·</span><h3>No partners match</h3></div></td></tr>';return;}
    tbody.innerHTML=items.map(function(p){
      return '<tr style="cursor:pointer" data-id="'+p.id+'">'
        +'<td><div style="display:flex;align-items:center;gap:10px">'
        +'<div class="pd-monogram" style="width:32px;height:32px;background:'+PILLAR_COLORS[p.pillar]+';font-size:11px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff">'+monogram(p.name)+'</div>'
        +'<div><div style="font-weight:600">'+esc(p.name)+'</div><div style="font-size:11px;color:var(--text-muted)">'+esc(p.role_title)+'</div></div></div></td>'
        +'<td><span style="font-size:12px;color:'+PILLAR_COLORS[p.pillar]+';font-weight:600">'+PILLAR_LABELS[p.pillar]+'</span></td>'
        +'<td>'+statusPill(p.status)+'</td>'
        +'<td>'+(p.rating?'&#9733; '+p.rating.toFixed(1):'—')+'</td>'
        +'<td>'+p.revenue_share_pct+'%</td>'
        +'<td>'+(p.verified?'<span style="color:var(--teal);font-weight:600">✓</span>':'<span style="color:var(--text-muted)">—</span>')+'</td>'
        +'</tr>';
    }).join('');
    tbody.querySelectorAll('[data-id]').forEach(function(row){
      row.addEventListener('click',function(){openPanel(row.dataset.id);});
    });
  }

  function openPanel(id){
    currentId=id;
    var p=allPartners.find(function(x){return x.id===id;}); if(!p)return;
    document.getElementById('pd-panel-name').textContent=p.name;
    renderTabOverview(p);
    renderTabContent(p);
    renderTabMembers(p);
    renderTabRevenue(p);
    renderTabSettings(p);
    document.getElementById('pd-panel').style.display='block';
    document.getElementById('pd-overlay').style.display='block';
    // Wire subtabs
    document.querySelectorAll('.subtab').forEach(function(btn){
      btn.addEventListener('click',function(){
        document.querySelectorAll('.subtab').forEach(function(b){b.classList.remove('active');});
        document.querySelectorAll('.pd-tab-pane').forEach(function(pane){pane.style.display='none';});
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).style.display='block';
      });
    });
    // default first tab active
    document.querySelectorAll('.subtab')[0].classList.add('active');
    document.getElementById('pd-tab-overview').style.display='block';
  }

  function renderTabOverview(p){
    document.getElementById('pd-tab-overview').innerHTML=
      '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">'
      +'<div class="pd-monogram" style="background:'+PILLAR_COLORS[p.pillar]+'">'+monogram(p.name)+'</div>'
      +'<div><div style="font-weight:600;font-size:15px">'+esc(p.name)+'</div><div style="color:var(--text-muted);font-size:12px">'+esc(p.role_title)+'</div></div></div>'
      +'<div class="pd-detail-row"><div class="pd-detail-label">Bio</div><div class="pd-detail-val">'+esc(p.bio||'—')+'</div></div>'
      +'<div class="pd-detail-row"><div class="pd-detail-label">Why they\'re here</div><div class="pd-detail-val">'+esc(p.why||'—')+'</div></div>'
      +'<div class="pd-detail-row"><div class="pd-detail-label">Community feel</div><div class="pd-detail-val">'+esc(p.feel||'—')+'</div></div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">'
      +'<div class="kpi-card"><div class="kpi-val">'+statusPill(p.status)+'</div><div class="kpi-label">Status</div></div>'
      +'<div class="kpi-card"><div class="kpi-val">'+(p.rating?'★ '+p.rating.toFixed(1):'—')+'</div><div class="kpi-label">Rating</div></div>'
      +'<div class="kpi-card"><div class="kpi-val">'+p.revenue_share_pct+'%</div><div class="kpi-label">Rev share</div></div>'
      +'</div>'
      +'<div style="display:flex;gap:8px">'
      +'<a class="btn btn-primary" href="#/partner-directory" onclick="closePdPanel()">Manage in pipeline</a>'
      +'</div>';
  }

  function renderTabContent(p){
    var el=document.getElementById('pd-tab-content');
    el.innerHTML='<div class="empty"><span class="spinner"></span></div>';
    sb.from('partner_content_items').select('*').eq('partner_id',p.id).order('created_at',{ascending:false}).then(function(res){
      var items=res.data||[];
      if(!items.length){el.innerHTML='<div class="empty"><h3>No content yet</h3></div>';return;}
      el.innerHTML='<table class="tbl"><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Plays</th></tr></thead><tbody>'
        +items.map(function(c){
          var mColors={published:'badge-green',in_review:'badge-blue',flagged:'badge-red',returned:'badge-amber',draft:'badge-grey'};
          return'<tr><td style="font-size:13px">'+esc(c.title)+'</td><td style="font-size:12px;color:var(--text-muted)">'+c.type+'</td>'
            +'<td><span class="badge '+(mColors[c.moderation_status]||'badge-grey')+'">'+c.moderation_status+'</span></td>'
            +'<td style="font-size:12px">'+c.play_count+'</td></tr>';
        }).join('')+'</tbody></table>';
    });
  }

  function renderTabMembers(p){
    var el=document.getElementById('pd-tab-members');
    el.innerHTML='<div class="empty"><span class="spinner"></span></div>';
    sb.from('partner_memberships').select('*').eq('partner_id',p.id).then(function(res){
      var items=res.data||[];
      if(!items.length){el.innerHTML='<div class="empty"><h3>No members yet</h3></div>';return;}
      var segColors={highly_engaged:'badge-green',regular:'badge-blue',at_risk:'badge-red'};
      el.innerHTML='<table class="tbl"><thead><tr><th>Member</th><th>Segment</th><th>Sessions</th><th>Joined</th></tr></thead><tbody>'
        +items.map(function(m){
          return'<tr><td style="font-size:12px">'+esc(m.member_email)+'</td>'
            +'<td><span class="badge '+(segColors[m.engagement_segment]||'badge-grey')+'">'+m.engagement_segment+'</span></td>'
            +'<td>'+m.sessions_attended+'</td>'
            +'<td style="font-size:12px;color:var(--text-muted)">'+(m.joined_at?new Date(m.joined_at).toLocaleDateString('en-GB'):'—')+'</td></tr>';
        }).join('')+'</tbody></table>';
    });
  }

  function renderTabRevenue(p){
    var el=document.getElementById('pd-tab-revenue');
    el.innerHTML='<div class="empty"><span class="spinner"></span></div>';
    sb.from('partner_payouts').select('*').eq('partner_id',p.id).order('period',{ascending:false}).then(function(res){
      var items=res.data||[];
      if(!items.length){el.innerHTML='<div class="empty"><h3>No payouts yet</h3></div>';return;}
      el.innerHTML='<table class="tbl"><thead><tr><th>Period</th><th>Gross</th><th>Share</th><th>Payout</th><th>Status</th></tr></thead><tbody>'
        +items.map(function(p){
          return'<tr><td>'+p.period+'</td><td>£'+Number(p.gross).toLocaleString()+'</td><td>'+p.share_pct+'%</td>'
            +'<td style="font-weight:600">£'+Number(p.payout_amount).toLocaleString()+'</td>'
            +'<td><span class="badge '+(p.status==='paid'?'badge-green':'badge-amber')+'">'+p.status+'</span></td></tr>';
        }).join('')+'</tbody></table>';
    });
  }

  function renderTabSettings(p){
    document.getElementById('pd-tab-settings').innerHTML=
      '<div class="pd-detail-row"><div class="pd-detail-label">Revenue share %</div>'
      +'<div style="display:flex;gap:8px;align-items:center"><input id="pd-rs-val" type="number" min="0" max="100" value="'+p.revenue_share_pct+'" style="width:80px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text);font-size:14px">'
      +'<button class="btn btn-primary" id="pd-rs-save">Save</button></div></div>'
      +'<div class="pd-detail-row" style="margin-top:16px"><div class="pd-detail-label">Verification</div>'
      +'<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">'
      +'<input type="checkbox" id="pd-verified" '+(p.verified?'checked':'')+'> Verified partner</label></div>'
      +'<button class="btn" id="pd-settings-save" style="margin-top:16px">Save settings</button>';
    setTimeout(function(){
      var s=document.getElementById('pd-settings-save');
      if(s) s.addEventListener('click',async function(){
        var rs=parseFloat(document.getElementById('pd-rs-val').value)||30;
        var ver=document.getElementById('pd-verified').checked;
        var res=await sb.from('partner_partners').update({revenue_share_pct:rs,verified:ver}).eq('id',p.id);
        if(res.error){alert('Error: '+res.error.message);return;}
        p.revenue_share_pct=rs; p.verified=ver;
        allPartners=allPartners.map(function(x){return x.id===p.id?Object.assign({},x,{revenue_share_pct:rs,verified:ver}):x;});
        render();
        if(window.VYVE_UI&&window.VYVE_UI.toast) window.VYVE_UI.toast('Settings saved','success');
      });
    },50);
  }

  window.closePdPanel=function(){
    document.getElementById('pd-panel').style.display='none';
    document.getElementById('pd-overlay').style.display='none';
  };

  ['pd-search','pd-status','pd-pillar'].forEach(function(id){
    document.getElementById(id)&&document.getElementById(id).addEventListener('input',render);
    document.getElementById(id)&&document.getElementById(id).addEventListener('change',render);
  });

  async function load(){
    await new Promise(function(r){if(getClient())return r();var t=setInterval(function(){if(getClient()){clearInterval(t);r();}},100);});
    sb=getClient();
    var res=await sb.from('partner_partners').select('*').order('created_at',{ascending:false});
    allPartners=res.data||[];
    render();
  }
  load().catch(function(e){console.error('[partner-directory]',e);});
})();
</script>
