<div class="page active" id="page-intel-hub" style="margin:-32px -32px 0">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--surface-2);border-bottom:1px solid var(--border)">
    <div>
      <div style="font-family:var(--font-head);font-size:16px;font-weight:700;color:var(--text)">Intel Hub</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">UK Corporate Wellbeing &middot; Competitive Intelligence &middot; 19 competitors tracked</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-ghost" id="ih-reload" title="Reload">Reload</button>
      <a class="btn" href="https://vyvehealth.github.io/vyve-intel-hub/" target="_blank" rel="noopener" style="font-size:12px">Open in new tab &rarr;</a>
    </div>
  </div>

  <div id="ih-frame-wrap" style="position:relative;background:var(--vyve-dark);height:calc(100vh - 130px);min-height:600px">
    <div id="ih-loader" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--text-muted);z-index:1">
      <span class="spinner"></span>
      <div style="font-size:13px">Loading Intel Hub&hellip;</div>
    </div>
    <iframe
      id="ih-frame"
      src="https://vyvehealth.github.io/vyve-intel-hub/"
      style="width:100%;height:100%;border:0;display:block;background:var(--vyve-dark);opacity:0;transition:opacity .3s"
      sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-forms"
      referrerpolicy="no-referrer"
      loading="eager">
    </iframe>
  </div>
</div>

<script>
(function(){
  var frame = document.getElementById('ih-frame');
  var loader = document.getElementById('ih-loader');
  if (!frame) return;
  frame.addEventListener('load', function(){
    frame.style.opacity = '1';
    if (loader) loader.style.display = 'none';
  });
  // Fail-safe: hide loader after 8s even if load event doesn't fire (some iframes don't)
  setTimeout(function(){
    frame.style.opacity = '1';
    if (loader) loader.style.display = 'none';
  }, 8000);

  document.getElementById('ih-reload').addEventListener('click', function(){
    if (loader){ loader.style.display = 'flex'; }
    frame.style.opacity = '0';
    var src = frame.src;
    frame.src = 'about:blank';
    setTimeout(function(){ frame.src = src; }, 50);
  });
})();
</script>
