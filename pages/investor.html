<!-- =====================================================================
     VYVE Command Centre — Investors & Grants (PM-758, CC overhaul Phase 3)
     cc_investors + cc_grants CRUD. CHECK vocabularies:
     investors.stage cold/intro/meeting/due-diligence/term-sheet/passed
     investors.type Angel/VC/Family Office/Grant Body/Corporate
     grants.status identified/applying/submitted/awarded/rejected
     ===================================================================== -->
<style>
.ig-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.ig-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.ig-h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.ig-meta{font-size:13px;color:var(--text-muted)}
.ig-btn{border:0;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.ig-btn.primary{background:var(--accent);color:var(--on-accent)}
.ig-btn.primary:hover{background:var(--accent-hover)}
.ig-btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
.ig-btn.danger{background:var(--danger-pale);color:var(--danger)}
.ig-sect{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.ig-sect:first-of-type{margin-top:0}
.ig-sect::after{content:"";flex:1;height:1px;background:var(--border)}
.ig-sect button{margin-left:auto}
.ig-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md);overflow-x:auto}
.ig-table{width:100%;border-collapse:collapse}
.ig-table th{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);text-align:left;padding:10px 16px;border-bottom:1px solid var(--border)}
.ig-table td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.ig-table td.num{font-variant-numeric:tabular-nums;font-weight:600}
.ig-table tbody tr:last-child td{border-bottom:0}
.ig-table tbody tr{cursor:pointer;transition:background .12s}
.ig-table tbody tr:hover{background:var(--accent-pale)}
.ig-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px}
.ig-pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.ig-pill.cold,.ig-pill.identified{background:var(--surface-2);color:var(--text-muted)}
.ig-pill.intro,.ig-pill.meeting,.ig-pill.applying{background:var(--accent-pale);color:var(--accent)}
.ig-pill.due-diligence,.ig-pill.submitted{background:var(--warning-pale);color:var(--warning)}
.ig-pill.term-sheet,.ig-pill.awarded{background:var(--success-pale);color:var(--success)}
.ig-pill.passed,.ig-pill.rejected{background:var(--danger-pale);color:var(--danger)}
.ig-empty{padding:22px;text-align:center;color:var(--text-muted);font-size:13px}
.ig-error{background:var(--danger-pale);border-radius:12px;padding:12px 16px;color:var(--danger);font-size:13.5px;margin-bottom:14px;display:none}
.ig-overlay{position:fixed;inset:0;background:rgba(4,12,12,.6);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.ig-modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto}
.ig-mh{padding:18px 20px 0}.ig-mh h3{font-size:16px;font-weight:700}
.ig-mb{padding:12px 20px 4px}
.ig-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.ig-field label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.ig-in{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--text);font-family:var(--font-body);width:100%}
.ig-in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ig-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ig-mf{display:flex;justify-content:space-between;gap:10px;padding:16px 20px 18px}
.ig-mf-right{display:flex;gap:10px}
</style>

<div class="ig-head">
  <div>
    <div class="ig-eyebrow">Run the Business</div>
    <div class="ig-h1">Investors &amp; Grants</div>
    <div class="ig-meta" id="ig-meta">Loading…</div>
  </div>
</div>
<div class="ig-error" id="ig-error"></div>

<div class="ig-sect">Investors <button class="ig-btn primary" id="ig-add-inv">Add investor</button></div>
<div class="ig-card">
  <table class="ig-table">
    <thead><tr><th>Name</th><th>Type</th><th>Stage</th><th>Amount</th><th>Next action</th></tr></thead>
    <tbody id="ig-inv-rows"><tr><td colspan="5" class="ig-empty">Loading…</td></tr></tbody>
  </table>
</div>

<div class="ig-sect">Grants <button class="ig-btn primary" id="ig-add-gr">Add grant</button></div>
<div class="ig-card">
  <table class="ig-table">
    <thead><tr><th>Grant</th><th>Funder</th><th>Amount</th><th>Deadline</th><th>Status</th><th>Notes</th></tr></thead>
    <tbody id="ig-gr-rows"><tr><td colspan="6" class="ig-empty">Loading…</td></tr></tbody>
  </table>
</div>

<script>
(function(){
  var INV_STAGES = ['cold','intro','meeting','due-diligence','term-sheet','passed'];
  var INV_TYPES  = ['Angel','VC','Family Office','Grant Body','Corporate'];
  var GR_STATUS  = ['identified','applying','submitted','awarded','rejected'];
  var invs = [], grants = [];
  function el(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function err(m){ var e=el('ig-error'); e.style.display='block'; e.textContent=m; }
  function sb(){ return window.VYVE_SUPABASE && window.VYVE_SUPABASE.client && window.VYVE_SUPABASE.client(); }
  function gbp(v){ return v==null?'—':'£'+Number(v).toLocaleString('en-GB'); }
  function opts(list, sel){ return list.map(function(s){return '<option value="'+s+'"'+(sel===s?' selected':'')+'>'+s+'</option>'}).join(''); }

  function render(){
    var activeInv = invs.filter(function(i){return i.stage!=='passed'}).length;
    var openGr = grants.filter(function(g){return g.status==='identified'||g.status==='applying'||g.status==='submitted'}).length;
    el('ig-meta').textContent = activeInv + ' active investor conversations · ' + openGr + ' open grants';

    var ir = el('ig-inv-rows');
    ir.innerHTML = invs.length ? invs.map(function(i){
      return '<tr data-k="inv" data-id="'+i.id+'"><td><b>'+esc(i.name)+'</b>'+(i.contact?'<div style="font-size:12px;color:var(--text-muted)">'+esc(i.contact)+'</div>':'')+'</td>'+
        '<td>'+esc(i.type||'—')+'</td><td><span class="ig-pill '+esc(i.stage)+'"><i></i>'+esc(i.stage)+'</span></td>'+
        '<td class="num">'+gbp(i.amount)+'</td><td>'+esc(i.next_action||'')+'</td></tr>';
    }).join('') : '<tr><td colspan="5" class="ig-empty">No investor conversations yet. Series A targets: £1–2M ARR, 10%+ MoM, sub-8% churn, 100%+ NRR.</td></tr>';

    var gr = el('ig-gr-rows');
    gr.innerHTML = grants.length ? grants.map(function(g){
      return '<tr data-k="gr" data-id="'+g.id+'"><td><b>'+esc(g.name)+'</b></td><td>'+esc(g.funder||'—')+'</td>'+
        '<td class="num">'+gbp(g.amount)+'</td><td>'+esc(g.deadline||'—')+'</td>'+
        '<td><span class="ig-pill '+esc(g.status)+'"><i></i>'+esc(g.status)+'</span></td><td>'+esc(g.notes||'')+'</td></tr>';
    }).join('') : '<tr><td colspan="6" class="ig-empty">No grants tracked yet.</td></tr>';

    document.querySelectorAll('#ig-inv-rows tr[data-id]').forEach(function(tr){
      tr.addEventListener('click', function(){ openInv(invs.find(function(i){return i.id===tr.getAttribute('data-id')})); });
    });
    document.querySelectorAll('#ig-gr-rows tr[data-id]').forEach(function(tr){
      tr.addEventListener('click', function(){ openGrant(grants.find(function(g){return g.id===tr.getAttribute('data-id')})); });
    });
  }

  async function load(){
    var client = sb();
    if (!client){ err('Supabase client unavailable — reload.'); return; }
    var res = await Promise.all([
      client.from('cc_investors').select('*').order('updated_at',{ascending:false}),
      client.from('cc_grants').select('*').order('deadline',{ascending:true,nullsFirst:false})
    ]);
    if (res[0].error){ err('Investors failed to load: '+res[0].error.message); return; }
    if (res[1].error){ err('Grants failed to load: '+res[1].error.message); return; }
    invs = res[0].data||[]; grants = res[1].data||[];
    render();
  }

  var overlay=null;
  function closeModal(){ if(overlay){overlay.remove();overlay=null;} }
  function modal(title, bodyHtml, canDelete){
    closeModal();
    overlay = document.createElement('div');
    overlay.className='ig-overlay';
    overlay.innerHTML = '<div class="ig-modal"><div class="ig-mh"><h3>'+title+'</h3></div><div class="ig-mb">'+bodyHtml+'</div>'+
      '<div class="ig-mf">'+(canDelete?'<button class="ig-btn danger" id="g-delete">Delete</button>':'<span></span>')+
      '<div class="ig-mf-right"><button class="ig-btn secondary" id="g-cancel">Cancel</button><button class="ig-btn primary" id="g-save">Save</button></div></div></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if(e.target===overlay) closeModal(); });
    overlay.querySelector('#g-cancel').addEventListener('click', closeModal);
    return overlay;
  }
  function v(id){ return overlay.querySelector(id).value; }
  function num(id){ var x=v(id); return x===''?null:Number(x); }
  async function withEmail(payload){
    try { var s = await sb().auth.getSession(); payload.created_by = (s.data.session && s.data.session.user.email) || null; } catch(_){}
    return payload;
  }
  async function save(table, isNew, id, payload, btn){
    btn.disabled=true; btn.textContent='Saving…';
    var res;
    if (isNew) res = await sb().from(table).insert(await withEmail(payload));
    else { payload.updated_at = new Date().toISOString(); res = await sb().from(table).update(payload).eq('id', id); }
    if (res.error){ btn.disabled=false; btn.textContent='Save'; err('Save failed: '+res.error.message); return false; }
    closeModal(); el('ig-error').style.display='none'; load(); return true;
  }
  async function remove(table, id, label){
    if (!confirm('Delete '+label+'? This cannot be undone.')) return;
    var res = await sb().from(table).delete().eq('id', id);
    if (res.error){ err('Delete failed: '+res.error.message); return; }
    closeModal(); load();
  }

  function openInv(inv){
    var isNew = !inv; inv = inv||{};
    modal(isNew?'Add investor':'Edit investor',
      '<div class="ig-field"><label>Name</label><input class="ig-in" id="f-name" value="'+esc(inv.name||'')+'"></div>'+
      '<div class="ig-two"><div class="ig-field"><label>Contact</label><input class="ig-in" id="f-contact" value="'+esc(inv.contact||'')+'"></div>'+
      '<div class="ig-field"><label>Email</label><input class="ig-in" id="f-email" value="'+esc(inv.email||'')+'"></div></div>'+
      '<div class="ig-two"><div class="ig-field"><label>Type</label><select class="ig-in" id="f-type">'+opts(INV_TYPES,inv.type)+'</select></div>'+
      '<div class="ig-field"><label>Stage</label><select class="ig-in" id="f-stage">'+opts(INV_STAGES,inv.stage)+'</select></div></div>'+
      '<div class="ig-field"><label>Amount £</label><input class="ig-in" id="f-amount" type="number" step="1" value="'+(inv.amount!=null?esc(inv.amount):'')+'"></div>'+
      '<div class="ig-field"><label>Next action</label><input class="ig-in" id="f-next" value="'+esc(inv.next_action||'')+'"></div>'+
      '<div class="ig-field"><label>Notes</label><input class="ig-in" id="f-notes" value="'+esc(inv.notes||'')+'"></div>', !isNew);
    overlay.querySelector('#g-save').addEventListener('click', function(){
      var name = v('#f-name').trim(); if(!name){ overlay.querySelector('#f-name').focus(); return; }
      save('cc_investors', isNew, inv.id, {name:name, contact:v('#f-contact').trim()||null, email:v('#f-email').trim()||null,
        type:v('#f-type'), stage:v('#f-stage'), amount:num('#f-amount'),
        next_action:v('#f-next').trim()||null, notes:v('#f-notes').trim()||null}, this);
    });
    if (!isNew) overlay.querySelector('#g-delete').addEventListener('click', function(){ remove('cc_investors', inv.id, inv.name); });
  }

  function openGrant(g){
    var isNew = !g; g = g||{};
    modal(isNew?'Add grant':'Edit grant',
      '<div class="ig-field"><label>Grant</label><input class="ig-in" id="f-name" value="'+esc(g.name||'')+'"></div>'+
      '<div class="ig-two"><div class="ig-field"><label>Funder</label><input class="ig-in" id="f-funder" value="'+esc(g.funder||'')+'"></div>'+
      '<div class="ig-field"><label>Amount £</label><input class="ig-in" id="f-amount" type="number" step="1" value="'+(g.amount!=null?esc(g.amount):'')+'"></div></div>'+
      '<div class="ig-two"><div class="ig-field"><label>Deadline</label><input class="ig-in" id="f-deadline" type="date" value="'+esc(g.deadline||'')+'"></div>'+
      '<div class="ig-field"><label>Status</label><select class="ig-in" id="f-status">'+opts(GR_STATUS,g.status)+'</select></div></div>'+
      '<div class="ig-field"><label>Notes</label><input class="ig-in" id="f-notes" value="'+esc(g.notes||'')+'"></div>', !isNew);
    overlay.querySelector('#g-save').addEventListener('click', function(){
      var name = v('#f-name').trim(); if(!name){ overlay.querySelector('#f-name').focus(); return; }
      save('cc_grants', isNew, g.id, {name:name, funder:v('#f-funder').trim()||null, amount:num('#f-amount'),
        deadline:v('#f-deadline')||null, status:v('#f-status'), notes:v('#f-notes').trim()||null}, this);
    });
    if (!isNew) overlay.querySelector('#g-delete').addEventListener('click', function(){ remove('cc_grants', g.id, g.name); });
  }

  el('ig-add-inv').addEventListener('click', function(){ openInv(null); });
  el('ig-add-gr').addEventListener('click', function(){ openGrant(null); });
  load();
})();
</script>
