<div class="page active" id="page-intel">
  <div class="page-header">
    <div class="hdr-row">
      <div>
        <div class="eyebrow">Intelligence</div><h1 class="page-title">Research &amp; Grants</h1><p class="page-sub">Grants &middot; legislation &middot; research signals. Tag your wins, deadlines and source.</p>
      </div>
      <button class="btn btn-primary" id="intel-add">Add item</button>
    </div>
  </div>

  <div class="grid-4" style="margin-bottom:18px">
    <div class="stat"><div class="stat-label">Total signals</div><div class="stat-value" id="intel-total">0</div></div>
    <div class="stat"><div class="stat-label">Grants</div><div class="stat-value" id="intel-c-grants">0</div></div>
    <div class="stat"><div class="stat-label">Legislation</div><div class="stat-value" id="intel-c-legis">0</div></div>
    <div class="stat"><div class="stat-label">Research</div><div class="stat-value" id="intel-c-research">0</div></div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="intel-grants">Grants</button>
    <button class="tab-btn" data-tab="intel-legis">Legislation</button>
    <button class="tab-btn" data-tab="intel-research">Research</button>
  </div>

  <div id="intel-grants"    class="tab-panel active"><div class="card"><div id="intel-grants-list"></div></div></div>
  <div id="intel-legis"     class="tab-panel"><div class="card"><div id="intel-legis-list"></div></div></div>
  <div id="intel-research"  class="tab-panel"><div class="card"><div id="intel-research-list"></div></div></div>
</div>

<script>
(function(){
  var LS = 'vyve_intel';
  function lsGet(){ try { var v = localStorage.getItem(LS); return v ? JSON.parse(v) : []; } catch(e){ return []; } }
  function lsSet(v){ try { localStorage.setItem(LS, JSON.stringify(v)); } catch(e){} }

  async function load(){
    if (window.VYVE_MAKE && VYVE_MAKE.hasToken && VYVE_MAKE.hasToken()){
      var fm = await VYVE_MAKE.list('intel', { limit: 200 });
      if (fm && fm.length) return fm;
    }
    return lsGet();
  }
  function saveItem(id, item){
    var a = lsGet();
    var i = a.findIndex(function(x){ return x._id === id; });
    var entry = Object.assign({ _id: id }, item, { updated_at: new Date().toISOString() });
    if (i >= 0) a[i] = entry; else a.unshift(entry);
    lsSet(a);
  }
  function removeItem(id){ lsSet(lsGet().filter(function(x){ return x._id !== id; })); }

  function escape(s){ return VYVE_UI.escape(String(s||'')); }
  function fmtDate(s){ if (!s) return ''; var d = new Date(s); return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }

  // Tabs
  document.querySelectorAll('#page-intel .tab-btn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#page-intel .tab-btn').forEach(function(x){ x.classList.remove('active'); });
      document.querySelectorAll('#page-intel .tab-panel').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      document.getElementById(b.dataset.tab).classList.add('active');
    });
  });

  function render(items){
    var byType = { grant: [], legislation: [], research: [] };
    items.forEach(function(it){
      var t = (it.type || 'research').toLowerCase();
      if (!byType[t]) t = 'research';
      byType[t].push(it);
    });

    document.getElementById('intel-total').textContent = items.length;
    document.getElementById('intel-c-grants').textContent = byType.grant.length;
    document.getElementById('intel-c-legis').textContent = byType.legislation.length;
    document.getElementById('intel-c-research').textContent = byType.research.length;

    function renderList(mountId, list, emptyLabel){
      var mount = document.getElementById(mountId);
      if (!list.length){
        mount.innerHTML = '<div class="empty"><span class="icon">·</span><h3>No ' + emptyLabel + ' yet</h3><p>Use \"Add item\" or wire the intelligence agents through Make.</p></div>';
        return;
      }
      mount.innerHTML = list.sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); }).map(function(it){
        var srcBadge = it.source ? '<span class="badge badge-grey">' + escape(it.source) + '</span>' : '';
        var dueBadge = it.deadline ? '<span class="badge badge-amber">deadline ' + escape(fmtDate(it.deadline)) + '</span>' : '';
        return '<div class="list-row" data-id="' + escape(it._id) + '" style="cursor:pointer">' +
          '<div class="list-row-main">' +
            '<div class="list-row-title">' + escape(it.title || '(untitled)') + '</div>' +
            '<div class="list-row-sub">' + escape((it.summary||'').slice(0,180)) + '</div>' +
          '</div>' +
          '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0">' +
            srcBadge + dueBadge +
            (it.created_at ? '<span style="font-size:11px;color:var(--text-muted);white-space:nowrap">' + escape(fmtDate(it.created_at)) + '</span>' : '') +
          '</div>' +
        '</div>';
      }).join('');

      mount.querySelectorAll('[data-id]').forEach(function(row){
        row.addEventListener('click', function(){ openEdit(row.dataset.id); });
      });
    }

    renderList('intel-grants-list',   byType.grant,       'grants');
    renderList('intel-legis-list',    byType.legislation, 'legislation items');
    renderList('intel-research-list', byType.research,    'research signals');
  }

  function openEdit(idOrNull){
    var items = lsGet();
    var existing = idOrNull ? items.find(function(x){ return x._id === idOrNull; }) || {} : {};
    var id = idOrNull || ('intel_' + Date.now() + '_' + Math.random().toString(36).slice(2,7));
    var body =
      '<div class="form-group"><label>Title</label><input id="i-title" value="' + escape(existing.title || '') + '" style="width:100%"/></div>' +
      '<div class="form-row cols-2">' +
        '<div class="form-group"><label>Type</label>' +
          '<select id="i-type" style="width:100%">' +
            ['grant','legislation','research'].map(function(t){ return '<option value="' + t + '"' + (existing.type === t ? ' selected' : '') + '>' + t.charAt(0).toUpperCase() + t.slice(1) + '</option>'; }).join('') +
          '</select>' +
        '</div>' +
        '<div class="form-group"><label>Source</label><input id="i-source" value="' + escape(existing.source || '') + '" placeholder="Innovate UK / HSE / etc" style="width:100%"/></div>' +
      '</div>' +
      '<div class="form-group"><label>Summary</label><textarea id="i-summary" rows="3" style="width:100%">' + escape(existing.summary || '') + '</textarea></div>' +
      '<div class="form-row cols-2">' +
        '<div class="form-group"><label>Link</label><input id="i-link" value="' + escape(existing.link || '') + '" placeholder="https://..." style="width:100%"/></div>' +
        '<div class="form-group"><label>Deadline (optional)</label><input type="date" id="i-deadline" value="' + (existing.deadline ? existing.deadline.slice(0,10) : '') + '" style="width:100%"/></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;gap:10px;margin-top:8px">' +
        (idOrNull ? '<button class="btn btn-ghost" id="i-del" style="border-color:#e06060;color:#e06060" type="button">Delete</button>' : '<span></span>') +
        '<div style="display:flex;gap:8px">' +
          '<button class="btn btn-ghost" id="i-cancel" type="button">Cancel</button>' +
          '<button class="btn btn-primary" id="i-save" type="button">Save</button>' +
        '</div>' +
      '</div>';
    var m = VYVE_UI.modal({ title: idOrNull ? 'Edit signal' : 'Add signal', body: body });
    document.getElementById('i-cancel').addEventListener('click', m.close);
    document.getElementById('i-save').addEventListener('click', function(){
      var t = document.getElementById('i-title').value.trim();
      if (!t){ VYVE_UI.toast('Title required', 'error'); return; }
      saveItem(id, {
        title: t,
        type: document.getElementById('i-type').value,
        source: document.getElementById('i-source').value.trim(),
        summary: document.getElementById('i-summary').value.trim(),
        link: document.getElementById('i-link').value.trim(),
        deadline: document.getElementById('i-deadline').value,
        created_at: existing.created_at || new Date().toISOString()
      });
      m.close();
      load().then(render);
      VYVE_UI.toast('Saved', 'success');
    });
    if (idOrNull){
      document.getElementById('i-del').addEventListener('click', function(){
        if (confirm('Delete this signal?')){ removeItem(id); m.close(); load().then(render); VYVE_UI.toast('Deleted', 'success'); }
      });
    }
  }

  document.getElementById('intel-add').addEventListener('click', function(){ openEdit(null); });
  load().then(render);
})();
</script>
