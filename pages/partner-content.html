<div class="page active" id="page-partner-content">
  <div class="page-header">
    <div class="hdr-row">
      <div><div class="eyebrow">Partner Space</div><h1 class="page-title">Content &amp; Moderation</h1><p class="page-sub">Review, approve or return partner submissions</p></div>
    </div>
  </div>

  <!-- Section tabs -->
  <div style="display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border)">
    <button class="subtab active" data-sect="pco-queue">Queue <span id="pco-queue-count" class="badge badge-amber" style="margin-left:4px">0</span></button>
    <button class="subtab" data-sect="pco-flagged">Flagged <span id="pco-flag-count" class="badge badge-red" style="margin-left:4px">0</span></button>
    <button class="subtab" data-sect="pco-published">Published</button>
  </div>

  <div id="pco-queue">
    <div id="pco-queue-list"></div>
  </div>
  <div id="pco-flagged" style="display:none">
    <div id="pco-flagged-list"></div>
  </div>
  <div id="pco-published" style="display:none">
    <div id="pco-published-list"></div>
  </div>
</div>

<style>
.pco-item{background:var(--surface-1);border-radius:10px;padding:16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px}
.pco-type-badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;background:var(--surface-2);color:var(--text-muted);flex-shrink:0}
.pco-actions{display:flex;gap:8px;margin-top:10px}
.pco-partner-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
</style>

<script>
(function(){
  var sb, partnerMap={}, allContent=[];
  function getClient(){return window.VYVE_CC_SUPABASE||window.ccSupabase;}
  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var PILLAR_COLORS={body:'var(--teal)',mind:'#4a9eba',connect:'#e8a855'};

  // Section tab switching
  document.querySelectorAll('[data-sect]').forEach(function(btn){
    btn.addEventListener('click',function(){
      document.querySelectorAll('[data-sect]').forEach(function(b){b.classList.remove('active');});
      document.querySelectorAll('#pco-queue,#pco-flagged,#pco-published').forEach(function(el){el.style.display='none';});
      btn.classList.add('active');
      document.getElementById(btn.dataset.sect).style.display='block';
    });
  });

  function renderItems(containerId, items, showActions){
    var el=document.getElementById(containerId);
    if(!items.length){el.innerHTML='<div class="empty"><span>·</span><h3>Nothing here</h3></div>';return;}
    el.innerHTML=items.map(function(c){
      var pName=partnerMap[c.partner_id]||'Unknown';
      var pPillar=c.pillar||'body';
      var typeColor={video:'#4a9eba',live_session:'var(--teal)',program:'#e8a855',post:'var(--text-muted)'};
      var when=c.created_at?new Date(c.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
      var actions=showActions?
        '<div class="pco-actions">'
        +'<button class="btn btn-primary pco-approve" data-id="'+c.id+'" style="padding:6px 14px;font-size:12px">Approve</button>'
        +'<button class="btn pco-return" data-id="'+c.id+'" style="padding:6px 14px;font-size:12px;color:var(--text-muted)">Return</button>'
        +'</div>':'';
      return '<div class="pco-item" data-id="'+c.id+'">'
        +'<div class="pco-partner-dot" style="background:'+PILLAR_COLORS[pPillar]+'"></div>'
        +'<div style="flex:1">'
        +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
        +'<span class="pco-type-badge" style="color:'+(typeColor[c.type]||'var(--text-muted)')+'">'+c.type.replace('_',' ')+'</span>'
        +'<span style="font-size:13px;font-weight:600">'+esc(c.title)+'</span>'
        +'</div>'
        +'<div style="font-size:12px;color:var(--text-muted)">'+esc(pName)+' · '+when+(c.duration_sec?' · '+Math.floor(c.duration_sec/60)+'m':'')+(c.description?' — '+esc(c.description.slice(0,80)):'')+'</div>'
        +actions
        +'</div></div>';
    }).join('');

    if(showActions){
      el.querySelectorAll('.pco-approve').forEach(function(btn){
        btn.addEventListener('click',function(){moderate(btn.dataset.id,'published');});
      });
      el.querySelectorAll('.pco-return').forEach(function(btn){
        btn.addEventListener('click',function(){moderate(btn.dataset.id,'returned');});
      });
    }
  }

  async function moderate(id, newStatus){
    var res=await sb.from('partner_content_items').update({
      moderation_status:newStatus,
      reviewed_at:new Date().toISOString()
    }).eq('id',id);
    if(res.error){alert('Error: '+res.error.message);return;}
    allContent=allContent.map(function(c){return c.id===id?Object.assign({},c,{moderation_status:newStatus}):c;});
    renderAll();
    if(window.VYVE_UI&&window.VYVE_UI.toast) window.VYVE_UI.toast(newStatus==='published'?'Content approved':'Returned to partner','success');
  }

  function renderAll(){
    var queue=allContent.filter(function(c){return c.moderation_status==='in_review';});
    var flagged=allContent.filter(function(c){return c.moderation_status==='flagged';});
    var published=allContent.filter(function(c){return c.moderation_status==='published';});
    document.getElementById('pco-queue-count').textContent=queue.length;
    document.getElementById('pco-flag-count').textContent=flagged.length;
    renderItems('pco-queue-list',queue,true);
    renderItems('pco-flagged-list',flagged,true);
    renderItems('pco-published-list',published,false);
  }

  async function load(){
    await new Promise(function(r){if(getClient())return r();var t=setInterval(function(){if(getClient()){clearInterval(t);r();}},100);});
    sb=getClient();
    var [pr,cr]=await Promise.all([
      sb.from('partner_partners').select('id,name,pillar'),
      sb.from('partner_content_items').select('*').order('created_at',{ascending:false})
    ]);
    (pr.data||[]).forEach(function(p){partnerMap[p.id]=p.name;});
    allContent=cr.data||[];
    renderAll();
  }
  load().catch(function(e){console.error('[partner-content]',e);});
})();
</script>
