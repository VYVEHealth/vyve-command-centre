<div class="page active" id="page-tasks">
  <div class="page-header">
    <div class="hdr-row">
      <div><div class="eyebrow">Delivery</div><h1 class="page-title">Tasks</h1><p class="page-sub">Company-wide task management across the team</p></div>
      <button class="btn btn-primary" id="tk-add">Add task</button>
    </div>
  </div>

  <div class="grid-4" style="margin-bottom:18px">
    <div class="stat"><div class="stat-label">Open tasks</div><div class="stat-value" id="tk-open">0</div></div>
    <div class="stat"><div class="stat-label">Due today</div><div class="stat-value" id="tk-today" style="color:var(--warning)">0</div></div>
    <div class="stat"><div class="stat-label">Overdue</div><div class="stat-value" id="tk-overdue" style="color:var(--danger)">0</div></div>
    <div class="stat"><div class="stat-label">Completed (7d)</div><div class="stat-value" id="tk-done" style="color:var(--success)">0</div></div>
  </div>

  <!-- Saved views & filters bar -->
  <div id="tk-views-bar"></div>

  <div class="kanban">
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">To do</span><span class="kanban-count" data-tk="todo">0</span></div><div class="kanban-body" data-tk="todo"></div></div>
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">In progress</span><span class="kanban-count" data-tk="doing">0</span></div><div class="kanban-body" data-tk="doing"></div></div>
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">Blocked</span><span class="kanban-count" data-tk="blocked">0</span></div><div class="kanban-body" data-tk="blocked"></div></div>
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">Done</span><span class="kanban-count" data-tk="done">0</span></div><div class="kanban-body" data-tk="done"></div></div>
  </div>
</div>

<script>
(function(){

  var LS='vyve_tasks';
  var allItems = [];
  var viewsBar = null;

  function lsGet(){ try { var v=localStorage.getItem(LS); return v?JSON.parse(v):[]; } catch(e){ return []; } }
  function lsSet(v){ try { localStorage.setItem(LS,JSON.stringify(v)); } catch(e){} }

  async function load(){
    if (window.VYVE_MAKE){ var fm = await VYVE_MAKE.list('tasks',{limit:500}); if (fm&&fm.length) return fm; }
    return lsGet();
  }
  async function save(id, item){
    var existing = lsGet().find(function(x){return x._id===id;});
    var op = existing ? 'update' : 'create';
    var diff = existing && window.VYVE_STORE ? window.VYVE_STORE.diff(existing, Object.assign({}, existing, item)) : null;
    if (window.VYVE_MAKE){ var r = await VYVE_MAKE.upsert('tasks', id, item); if (r) {
      if (window.VYVE_STORE) window.VYVE_STORE.logChange('task', id, null, op, diff);
      return;
    }}
    var a = lsGet(); var i = a.findIndex(function(x){return x._id===id;}); var e = Object.assign({_id:id}, item);
    if (i>=0) a[i]=e; else a.unshift(e); lsSet(a);
    if (window.VYVE_STORE) window.VYVE_STORE.logChange('task', id, null, op, diff);
  }
  async function remove(id){
    var existing = lsGet().find(function(x){return x._id===id;});
    if (window.VYVE_STORE && existing) window.VYVE_STORE.softDelete('task', id, existing);
    if (window.VYVE_MAKE) await VYVE_MAKE.remove('tasks', id);
    lsSet(lsGet().filter(function(x){return x._id!==id;}));
  }

  function uniqueOwners(items){
    return Array.from(new Set(items.map(function(t){return t.owner;}).filter(Boolean))).sort();
  }
  function uniqueAreas(items){
    return Array.from(new Set(items.map(function(t){return t.area;}).filter(Boolean))).sort();
  }

  function applyFilters(items, filters){
    return VYVE_VIEWS_UI.applyFilters(items, filters, {
      due: function(t){ return t.due; }
    });
  }

  function render(items){
    var filters = viewsBar ? viewsBar.getFilters() : {};
    var filtered = applyFilters(items, filters);

    var stages = { todo:[], doing:[], blocked:[], done:[] };
    filtered.forEach(function(t){ var s = (t.status||'todo').toLowerCase(); if (!stages[s]) s='todo'; stages[s].push(t); });

    var now = new Date(); now.setHours(0,0,0,0);
    var tomorrow = now.getTime() + 86400000;
    var weekAgo = Date.now() - 7*86400000;
    var open = filtered.filter(function(t){return (t.status||'')!=='done';});
    document.getElementById('tk-open').textContent = open.length;
    document.getElementById('tk-today').textContent = open.filter(function(t){ return t.due && new Date(t.due).getTime() >= now.getTime() && new Date(t.due).getTime() < tomorrow; }).length;
    document.getElementById('tk-overdue').textContent = open.filter(function(t){ return t.due && new Date(t.due).getTime() < now.getTime(); }).length;
    document.getElementById('tk-done').textContent = filtered.filter(function(t){ return t.status==='done' && new Date(t.completed_at||t.updated_at||0).getTime() > weekAgo; }).length;

    Object.keys(stages).forEach(function(stage){
      var body = document.querySelector('.kanban-body[data-tk="'+stage+'"]');
      var count = document.querySelector('.kanban-count[data-tk="'+stage+'"]');
      if (count) count.textContent = stages[stage].length;
      if (!body) return;
      if (!stages[stage].length){ body.innerHTML = '<div style="padding:16px 10px;text-align:center;font-size:11px;color:var(--text-muted)">Empty</div>'; return; }
      stages[stage].sort(function(a,b){ return new Date(a.due||'9999-12-31') - new Date(b.due||'9999-12-31'); });
      body.innerHTML = stages[stage].map(function(t){
        var dueColor = '';
        if (t.due && stage !== 'done'){
          var diff = new Date(t.due).getTime() - now.getTime();
          if (diff < 0) dueColor = 'color:var(--danger);font-weight:600';
          else if (diff < 86400000) dueColor = 'color:var(--warning);font-weight:600';
        }
        var prioBadge = '';
        if (t.priority === 'high') prioBadge = '<span class="badge badge-red" style="margin-right:6px;font-size:9px">HIGH</span>';
        else if (t.priority === 'low') prioBadge = '<span class="badge badge-grey" style="margin-right:6px;font-size:9px">LOW</span>';
        var ccount = (window.VYVE_COMMENTS ? window.VYVE_COMMENTS.count('task', t._id) : 0);
        var discussBtn = '<button type="button" class="task-discuss-btn" data-discuss="'+t._id+'" title="Comments & history" style="position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:999px;background:'+(ccount ? 'var(--vyve-teal-pale)' : 'transparent')+';color:'+(ccount ? 'var(--vyve-teal)' : 'var(--text-muted)')+';font-size:10.5px;font-weight:600;border:0;cursor:pointer">'+(ccount || '✉')+'</button>';
        return '<div class="kanban-card" data-id="'+t._id+'" style="position:relative;padding-right:42px">'+discussBtn+'<div class="kc-title">'+prioBadge+VYVE_UI.escape(t.title||'')+'</div><div class="kc-meta">'+VYVE_UI.escape(t.owner||'Unassigned')+(t.due?' &middot; <span style="'+dueColor+'">'+VYVE_UI.fmtDate(t.due)+'</span>':'')+'</div></div>';
      }).join('');
      body.querySelectorAll('.kanban-card').forEach(function(card){
        card.addEventListener('click', function(e){
          if (e.target.closest && e.target.closest('[data-discuss]')){
            e.stopPropagation();
            if (window.VYVE_WIDGETS && window.VYVE_WIDGETS.recordModal) {
              window.VYVE_WIDGETS.recordModal('task', card.dataset.id);
            }
            return;
          }
          if (e.shiftKey && window.VYVE_BULK && window.VYVE_BULK.active()) {
            e.preventDefault();
            window.VYVE_BULK.toggle(card.dataset.id);
            return;
          }
          edit(card.dataset.id, filtered);
        });
        card.addEventListener('mouseenter', function(){
          if (window.VYVE_BULK) window.VYVE_BULK.focused = card.dataset.id;
        });
      });
    });
    if (window.VYVE_BULK && window.VYVE_BULK.active()) window.VYVE_BULK.paint();
  }

  function edit(id, items){
    var t = items.find(function(x){return x._id===id;}); if(!t) return;
    openModal('Edit task', t, async function(u){ await save(id, u); allItems = await load(); refreshBar(); render(allItems); }, async function(){ await remove(id); allItems = await load(); refreshBar(); render(allItems); });
  }

  function openModal(title, init, onSave, onDel){
    init = init || {};
    var _modal = VYVE_UI.modal({ title: title, draftKey: 'task:' + (init._id || 'new'), body:
      '<div class="form-row"><div class="form-group"><label>Title</label><input id="t-title" value="'+VYVE_UI.escape(init.title||'')+'"/></div></div>'+
      '<div class="form-row cols-3"><div class="form-group"><label>Owner</label><input id="t-owner" value="'+VYVE_UI.escape(init.owner||'')+'"/></div><div class="form-group"><label>Status</label><select id="t-status"><option value="todo">To do</option><option value="doing">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option></select></div><div class="form-group"><label>Priority</label><select id="t-prio"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></div></div>'+
      '<div class="form-row cols-2"><div class="form-group"><label>Due date</label><input id="t-due" type="date" value="'+VYVE_UI.escape((init.due||'').slice(0,10))+'"/></div><div class="form-group"><label>Area</label><input id="t-area" placeholder="e.g. sales, ops, content" value="'+VYVE_UI.escape(init.area||'')+'"/></div></div>'+
      '<div class="form-row"><div class="form-group"><label>Notes</label><textarea id="t-notes" rows="3">'+VYVE_UI.escape(init.notes||'')+'</textarea></div></div>'+
      '<div style="display:flex;justify-content:space-between;gap:8px">'+(onDel?'<button class="btn" id="t-del" style="color:var(--danger);border-color:rgba(224,96,96,.3)">Delete</button>':'<span></span>')+'<button class="btn btn-primary" id="t-save">Save</button></div>'
    });
    setTimeout(function(){
      if (init.status) document.getElementById('t-status').value = init.status;
      if (init.priority) document.getElementById('t-prio').value = init.priority;
      document.getElementById('t-save').addEventListener('click', function(){
        var n = document.getElementById('t-title').value.trim();
        if (!n){ VYVE_UI.toast('Title required','error'); return; }
        var s = document.getElementById('t-status').value;
        var u = { title:n, owner:document.getElementById('t-owner').value.trim(), status:s, priority:document.getElementById('t-prio').value, due:document.getElementById('t-due').value, area:document.getElementById('t-area').value.trim(), notes:document.getElementById('t-notes').value.trim(), updated_at:new Date().toISOString(), created_at: init.created_at||new Date().toISOString() };
        if (s === 'done' && !init.completed_at) u.completed_at = new Date().toISOString();
        if (_modal && _modal.draft) _modal.draft.clear();
        onSave(u);
        document.querySelector('.modal-overlay').classList.remove('open');
      });
      if (onDel) document.getElementById('t-del').addEventListener('click', function(){ if (confirm('Delete?')){ onDel(); document.querySelector('.modal-overlay').classList.remove('open'); }});
    }, 50);
  }

  function refreshBar(){
    if (viewsBar) viewsBar.refresh();
  }

  function mountViewsBar(){
    if (!window.VYVE_VIEWS_UI) return;
    viewsBar = VYVE_VIEWS_UI.mount(document.getElementById('tk-views-bar'), {
      page: 'tasks',
      fields: [
        { key: 'status',   label: 'Status',   type: 'select', options: ['todo','doing','blocked','done'] },
        { key: 'priority', label: 'Priority', type: 'select', options: ['high','normal','low'] },
        { key: 'owner',    label: 'Owner',    type: 'select', dynamicOptions: function(){ return uniqueOwners(allItems); } },
        { key: 'area',     label: 'Area',     type: 'select', dynamicOptions: function(){ return uniqueAreas(allItems); } },
        { key: 'due',      label: 'Due',      type: 'date-range' }
      ],
      onChange: function(){ render(allItems); }
    });
  }

  document.getElementById('tk-add').addEventListener('click', function(){
    openModal('Add task', {}, async function(u){ await save('tk_'+Date.now(), u); allItems = await load(); refreshBar(); render(allItems); VYVE_UI.toast('Added','success'); });
  });

  // Register page-scoped keyboard shortcuts
  window.VYVE_PAGE_SHORTCUTS = {
    onNew: function(){ document.getElementById('tk-add').click(); },
    onEdit: function(){
      if (!window.VYVE_BULK || !window.VYVE_BULK.active()) return;
      var sel = Array.from(document.querySelectorAll('.kanban-card.bulk-selected'));
      if (sel.length === 1) edit(sel[0].dataset.id, allItems);
    }
  };

  // Enable bulk selection on task cards
  if (window.VYVE_BULK) {
    window.VYVE_BULK.enable({
      selector: '#page-tasks .kanban-card',
      idAttr: 'data-id',
      actions: ['mark-done', 'delete'],
      onAction: async function(action, ids){
        if (!ids.length) return;
        if (action === 'delete') {
          if (!confirm('Delete ' + ids.length + ' task' + (ids.length === 1 ? '' : 's') + '?')) return;
          for (var i = 0; i < ids.length; i++) await remove(ids[i]);
          if (window.VYVE_UI && window.VYVE_UI.toast) window.VYVE_UI.toast('Deleted ' + ids.length + ' task' + (ids.length === 1 ? '' : 's'), 'success');
        } else if (action === 'mark-done') {
          for (var j = 0; j < ids.length; j++) {
            var t = allItems.find(function(x){ return x._id === ids[j]; });
            if (t) await save(ids[j], Object.assign({}, t, { status: 'done', completed_at: new Date().toISOString(), updated_at: new Date().toISOString() }));
          }
          if (window.VYVE_UI && window.VYVE_UI.toast) window.VYVE_UI.toast('Marked ' + ids.length + ' done', 'success');
        }
        window.VYVE_BULK.clear();
        allItems = await load();
        refreshBar();
        render(allItems);
      }
    });
  }

  (async function(){
    mountViewsBar();
    allItems = await load();
    render(allItems);
  })();
})();
</script>
