<div class="page active" id="page-crm">
  <div class="page-header">
    <div class="hdr-row">
      <div><div class="eyebrow">Pipeline</div><h1 class="page-title">Sales Pipeline</h1><p class="page-sub">Leads, deals and enterprise opportunities</p></div>
      <button class="btn btn-primary" id="crm-add">Add deal</button>
    </div>
  </div>

  <div class="grid-4" style="margin-bottom:18px">
    <div class="stat"><div class="stat-label">Pipeline value</div><div class="stat-value" id="crm-value">£0</div><div class="stat-sub">weighted by stage</div></div>
    <div class="stat"><div class="stat-label">Active deals</div><div class="stat-value" id="crm-active">0</div></div>
    <div class="stat"><div class="stat-label">This quarter closes</div><div class="stat-value" id="crm-closes">0</div></div>
    <div class="stat"><div class="stat-label">Win rate (90d)</div><div class="stat-value" id="crm-win">—</div></div>
  </div>

  <!-- Saved views & filters bar -->
  <div id="crm-views-bar"></div>

  <div class="kanban">
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">Lead</span><span class="kanban-count" data-crm="lead">0</span></div><div class="kanban-body" data-crm="lead"></div></div>
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">Discovery</span><span class="kanban-count" data-crm="discovery">0</span></div><div class="kanban-body" data-crm="discovery"></div></div>
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">Proposal</span><span class="kanban-count" data-crm="proposal">0</span></div><div class="kanban-body" data-crm="proposal"></div></div>
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">Negotiation</span><span class="kanban-count" data-crm="negotiation">0</span></div><div class="kanban-body" data-crm="negotiation"></div></div>
    <div class="kanban-col"><div class="kanban-col-header"><span class="kanban-col-title">Won</span><span class="kanban-count" data-crm="won">0</span></div><div class="kanban-body" data-crm="won"></div></div>
  </div>
</div>

<script>
(function(){

  var LS='vyve_deals';
  function lsGet(){ try { var v=localStorage.getItem(LS); return v?JSON.parse(v):[]; } catch(e){ return []; } }
  function lsSet(v){ try { localStorage.setItem(LS,JSON.stringify(v)); } catch(e){} }
  async function load(){
    if (window.VYVE_MAKE){ var fm = await VYVE_MAKE.list('deals',{limit:500}); if (fm&&fm.length) return fm; }
    return lsGet();
  }
  async function save(id, item){
    var existing = lsGet().find(function(x){return x._id===id;});
    var op = existing ? 'update' : 'create';
    var diff = existing && window.VYVE_STORE ? window.VYVE_STORE.diff(existing, Object.assign({}, existing, item)) : null;
    if (window.VYVE_MAKE){ var r = await VYVE_MAKE.upsert('deals', id, item); if (r) {
      if (window.VYVE_STORE) window.VYVE_STORE.logChange('deal', id, null, op, diff);
      return;
    }}
    var a = lsGet(); var i = a.findIndex(function(x){return x._id===id;}); var e = Object.assign({_id:id}, item);
    if (i>=0) a[i]=e; else a.unshift(e); lsSet(a);
    if (window.VYVE_STORE) window.VYVE_STORE.logChange('deal', id, null, op, diff);
  }
  async function remove(id){
    var existing = lsGet().find(function(x){return x._id===id;});
    if (window.VYVE_STORE && existing) window.VYVE_STORE.softDelete('deal', id, existing);
    if (window.VYVE_MAKE) await VYVE_MAKE.remove('deals', id);
    lsSet(lsGet().filter(function(x){return x._id!==id;}));
  }

  var WEIGHTS = { lead:0.1, discovery:0.25, proposal:0.5, negotiation:0.75, won:1.0, lost:0.0 };

  var allItems = [];
  var viewsBar = null;

  function uniqueStages(items){
    return Array.from(new Set(items.map(function(d){return d.stage;}).filter(Boolean))).sort();
  }
  function uniqueOwners(items){
    return Array.from(new Set(items.map(function(d){return d.owner;}).filter(Boolean))).sort();
  }
  function uniqueSources(items){
    return Array.from(new Set(items.map(function(d){return d.source;}).filter(Boolean))).sort();
  }

  function applyFilters(items, filters){
    return window.VYVE_VIEWS_UI ? window.VYVE_VIEWS_UI.applyFilters(items, filters, {
      close_date: function(d){ return d.close_date; }
    }) : items;
  }

  function render(items){
    var filters = viewsBar ? viewsBar.getFilters() : {};
    items = applyFilters(items, filters);
    var stages = { lead:[], discovery:[], proposal:[], negotiation:[], won:[] };
    var active = items.filter(function(d){ return (d.stage||'lead') !== 'lost' && (d.stage||'lead') !== 'won' || (d.stage==='won' && new Date(d.close_date||d.updated_at||0).getTime() > Date.now()-90*86400000); });
    items.forEach(function(d){ var s=(d.stage||'lead').toLowerCase(); if (stages[s]) stages[s].push(d); });

    var weighted = items.reduce(function(s,d){ if ((d.stage||'')==='lost') return s; return s + ((Number(d.value)||0) * (WEIGHTS[d.stage||'lead']||0.1)); }, 0);
    document.getElementById('crm-value').textContent = VYVE_UI.fmtMoney(weighted);
    document.getElementById('crm-active').textContent = items.filter(function(d){ return (d.stage||'')!=='won' && (d.stage||'')!=='lost'; }).length;

    var d = new Date();
    var qEnd = new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3+3, 0).getTime();
    document.getElementById('crm-closes').textContent = items.filter(function(x){ return x.close_date && new Date(x.close_date).getTime() <= qEnd && (x.stage||'')!=='won' && (x.stage||'')!=='lost'; }).length;

    var ninety = Date.now() - 90*86400000;
    var recent = items.filter(function(x){ return new Date(x.close_date||x.updated_at||0).getTime() > ninety && ((x.stage||'')==='won' || (x.stage||'')==='lost'); });
    if (recent.length){
      var won = recent.filter(function(x){ return x.stage==='won'; }).length;
      document.getElementById('crm-win').textContent = Math.round(won / recent.length * 100) + '%';
    }

    Object.keys(stages).forEach(function(stage){
      var body = document.querySelector('.kanban-body[data-crm="'+stage+'"]');
      var count = document.querySelector('.kanban-count[data-crm="'+stage+'"]');
      if (count) count.textContent = stages[stage].length;
      if (!body) return;
      if (!stages[stage].length){ body.innerHTML = '<div style="padding:16px 10px;text-align:center;font-size:11px;color:var(--text-muted)">Empty</div>'; return; }
      body.innerHTML = stages[stage].map(function(x){
        var ccount = (window.VYVE_COMMENTS ? window.VYVE_COMMENTS.count('deal', x._id) : 0);
        var discussBtn = '<button type="button" class="crm-discuss-btn" data-discuss="'+x._id+'" title="Comments &amp; history" style="position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:999px;background:'+(ccount ? 'var(--vyve-teal-pale)' : 'transparent')+';color:'+(ccount ? 'var(--vyve-teal)' : 'var(--text-muted)')+';font-size:10.5px;font-weight:600;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px">'+
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+
          (ccount || '0') +
        '</button>';
        return '<div class="kanban-card" data-id="'+x._id+'" style="position:relative;padding-right:48px">'+discussBtn+'<div class="kc-title">'+VYVE_UI.escape(x.name||'(unnamed)')+'</div><div class="kc-meta">'+(x.value?VYVE_UI.fmtMoney(x.value):'')+(x.close_date?' &middot; '+VYVE_UI.fmtDate(x.close_date):'')+'</div></div>';
      }).join('');
      body.querySelectorAll('.kanban-card').forEach(function(card){
        card.addEventListener('click', function(e){
          // If they clicked the discuss button, open the record modal instead
          if (e.target.closest && e.target.closest('[data-discuss]')) {
            e.stopPropagation();
            if (window.VYVE_WIDGETS && window.VYVE_WIDGETS.recordModal) {
              window.VYVE_WIDGETS.recordModal('deal', card.dataset.id);
            }
            return;
          }
          edit(card.dataset.id);
        });
      });
    });
  }

  function edit(id){
    var d = allItems.find(function(x){return x._id===id;}); if(!d) return;
    openModal('Edit deal', d, async function(u){
      await save(id, u);
      allItems = await load();
      if (viewsBar) viewsBar.refresh();
      render(allItems);
    }, async function(){
      await remove(id);
      allItems = await load();
      if (viewsBar) viewsBar.refresh();
      render(allItems);
    });
  }

  function openModal(title, init, onSave, onDel){
    init = init || {};
    VYVE_UI.modal({ title: title, body:
      '<div class="form-row cols-2"><div class="form-group"><label>Account / company</label><input id="d-name" value="'+VYVE_UI.escape(init.name||'')+'"/></div><div class="form-group"><label>Stage</label><select id="d-stage"><option value="lead">Lead</option><option value="discovery">Discovery</option><option value="proposal">Proposal</option><option value="negotiation">Negotiation</option><option value="won">Won</option><option value="lost">Lost</option></select></div></div>'+
      '<div class="form-row cols-2"><div class="form-group"><label>Deal value (£)</label><input id="d-val" type="number" min="0" value="'+(init.value||'')+'"/></div><div class="form-group"><label>Expected close</label><input id="d-close" type="date" value="'+VYVE_UI.escape((init.close_date||'').slice(0,10))+'"/></div></div>'+
      '<div class="form-row cols-2"><div class="form-group"><label>Primary contact</label><input id="d-contact" value="'+VYVE_UI.escape(init.contact||'')+'"/></div><div class="form-group"><label>Source</label><input id="d-source" placeholder="e.g. LinkedIn, referral, podcast" value="'+VYVE_UI.escape(init.source||'')+'"/></div></div>'+
      '<div class="form-row"><div class="form-group"><label>Notes / next step</label><textarea id="d-notes" rows="3">'+VYVE_UI.escape(init.notes||'')+'</textarea></div></div>'+
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center">'+
        (onDel?'<button class="btn" id="d-del" style="color:var(--danger);border-color:rgba(224,96,96,.3)">Delete</button>':'<span></span>')+
        '<div style="display:flex;gap:8px;align-items:center">'+
          '<button type="button" class="btn btn-ghost btn-sm" id="d-send-email" title="Draft an email to the deal contact" style="display:inline-flex;align-items:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Email contact</button>'+
          '<button class="btn btn-primary" id="d-save">Save</button>'+
        '</div>'+
      '</div>'
    });
    setTimeout(function(){
      if (init.stage) document.getElementById('d-stage').value = init.stage;
      document.getElementById('d-save').addEventListener('click', function(){
        var n = document.getElementById('d-name').value.trim();
        if (!n){ VYVE_UI.toast('Account required','error'); return; }
        var u = { name:n, stage:document.getElementById('d-stage').value, value:Number(document.getElementById('d-val').value)||0, close_date:document.getElementById('d-close').value, contact:document.getElementById('d-contact').value.trim(), source:document.getElementById('d-source').value.trim(), notes:document.getElementById('d-notes').value.trim(), updated_at:new Date().toISOString(), created_at: init.created_at||new Date().toISOString() };
        onSave(u);
        document.querySelector('.modal-overlay').classList.remove('open');
      });
      if (onDel) document.getElementById('d-del').addEventListener('click', function(){ if (confirm('Delete?')){ onDel(); document.querySelector('.modal-overlay').classList.remove('open'); }});
      var sendBtn = document.getElementById('d-send-email');
      if (sendBtn) sendBtn.addEventListener('click', function(){
        if (!window.VYVE_INTEGRATIONS) return;
        var dealLike = {
          name: document.getElementById('d-name').value.trim(),
          value: Number(document.getElementById('d-val').value) || 0,
          notes: document.getElementById('d-notes').value.trim(),
          contact: document.getElementById('d-contact').value.trim(),
          contact_email: (init && init.contact_email) || ''
        };
        var draft = window.VYVE_INTEGRATIONS.emailForDeal(dealLike);
        window.VYVE_INTEGRATIONS.gmailCompose(draft);
      });
    }, 50);
  }

  document.getElementById('crm-add').addEventListener('click', function(){
    openModal('Add deal', {}, async function(u){
      await save('deal_'+Date.now(), u);
      allItems = await load();
      if (viewsBar) viewsBar.refresh();
      render(allItems);
      VYVE_UI.toast('Added','success');
    });
  });

  function mountViewsBar(){
    if (!window.VYVE_VIEWS_UI) return;
    viewsBar = VYVE_VIEWS_UI.mount(document.getElementById('crm-views-bar'), {
      page: 'crm',
      fields: [
        { key: 'stage',  label: 'Stage',  type: 'select', options: ['lead','discovery','proposal','negotiation','won','lost'] },
        { key: 'owner',  label: 'Owner',  type: 'select', dynamicOptions: function(){ return uniqueOwners(allItems); } },
        { key: 'source', label: 'Source', type: 'select', dynamicOptions: function(){ return uniqueSources(allItems); } },
        { key: 'close_date', label: 'Closing', type: 'date-range' }
      ],
      onChange: function(){ render(allItems); }
    });
  }

  window.VYVE_PAGE_SHORTCUTS = {
    onNew: function(){ document.getElementById('crm-add').click(); }
  };

  (async function(){
    mountViewsBar();
    allItems = await load();
    render(allItems);
  })();
})();
</script>
