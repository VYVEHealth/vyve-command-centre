<!-- =====================================================================
     VYVE Command Centre — Sales Pipeline (PM-756, CC overhaul Phase 3)
     Live cc_leads CRUD via client supabase-js under is_admin_or_team() RLS.
     Replaces the localStorage/VYVE_MAKE-era crm.html.
     Stages are DB CHECK-constrained: prospect/qualified/proposal/negotiation/won/lost.
     ===================================================================== -->
<style>
.cr-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.cr-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.cr-h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.cr-meta{font-size:13px;color:var(--text-muted)}
.cr-btn{border:0;border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
.cr-btn.primary{background:var(--accent);color:var(--on-accent)}
.cr-btn.primary:hover{background:var(--accent-hover)}
.cr-btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
.cr-btn.danger{background:var(--danger-pale);color:var(--danger)}
.cr-stage{margin-bottom:22px}
.cr-stage-h{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.cr-stage-h b{color:var(--text-muted);font-weight:500}
.cr-stage-h::after{content:"";flex:1;height:1px;background:var(--border)}
.cr-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.cr-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-md);cursor:pointer;transition:border-color .15s}
.cr-card:hover{border-color:var(--accent)}
.cr-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cr-co{font-size:15px;font-weight:700}
.cr-val{font-family:var(--font-mono);font-size:12px;color:var(--gold);white-space:nowrap}
.cr-contact{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.cr-next{margin-top:8px;font-size:12.5px;color:var(--text);background:var(--accent-pale);border-radius:8px;padding:6px 9px}
.cr-next b{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:1px}
.cr-notes{margin-top:8px;font-size:12px;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cr-empty{padding:14px;border:1px dashed var(--border-strong);border-radius:12px;color:var(--text-dim);font-size:12.5px;text-align:center}
.cr-error{background:var(--danger-pale);border-radius:12px;padding:12px 16px;color:var(--danger);font-size:13.5px;margin-bottom:14px;display:none}
.cr-skel{height:84px;border-radius:14px;background:var(--surface-2);animation:crP 1.4s infinite}
@keyframes crP{0%,100%{opacity:1}50%{opacity:.45}}
/* modal — appended to body to escape stacking contexts (§23.121) */
.cr-overlay{position:fixed;inset:0;background:rgba(4,12,12,.6);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.cr-modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto}
.cr-mh{padding:18px 20px 0}
.cr-mh h3{font-size:16px;font-weight:700}
.cr-mb{padding:12px 20px 4px}
.cr-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.cr-field label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim)}
.cr-in{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--text);font-family:var(--font-body);width:100%}
.cr-in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.cr-in{min-height:70px;resize:vertical}
.cr-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cr-mf{display:flex;justify-content:space-between;gap:10px;padding:16px 20px 18px}
.cr-mf-right{display:flex;gap:10px}
</style>

<div class="cr-head">
  <div>
    <div class="cr-eyebrow">Run the Business</div>
    <div class="cr-h1">Sales Pipeline</div>
    <div class="cr-meta" id="cr-meta">Loading…</div>
  </div>
  <button class="cr-btn primary" id="cr-add">Add lead</button>
</div>
<div class="cr-error" id="cr-error"></div>
<div id="cr-board"><div class="cr-skel"></div></div>

<script>
(function(){
  var STAGES = [
    ['qualified','Qualified'],['proposal','Proposal'],['negotiation','Negotiation'],
    ['prospect','Prospects'],['won','Won'],['lost','Lost']
  ];
  var STAGE_SET = STAGES.map(function(s){return s[0]});
  var leads = [];
  function el(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  function err(msg){ var e=el('cr-error'); e.style.display='block'; e.textContent=msg; }
  function clearErr(){ el('cr-error').style.display='none'; }
  function sb(){ return window.VYVE_SUPABASE && window.VYVE_SUPABASE.client && window.VYVE_SUPABASE.client(); }
  function gbp(v){ return v==null?'':'£'+Number(v).toLocaleString('en-GB')+'/mo'; }

  function render(){
    var host = el('cr-board');
    var open = leads.filter(function(l){return l.stage!=='won'&&l.stage!=='lost'}).length;
    var pipeVal = leads.filter(function(l){return l.stage!=='won'&&l.stage!=='lost'&&l.value!=null})
      .reduce(function(a,l){return a+Number(l.value)},0);
    el('cr-meta').textContent = open + ' open · ' + (pipeVal ? gbp(pipeVal)+' valued pipeline' : 'no values set yet');
    host.innerHTML = STAGES.map(function(st){
      var rows = leads.filter(function(l){return l.stage===st[0]});
      if (!rows.length && (st[0]==='won'||st[0]==='lost')) return '';
      var cards = rows.length ? rows.map(function(l){
        return '<div class="cr-card" data-id="'+l.id+'">'+
          '<div class="cr-top"><span class="cr-co">'+esc(l.company)+'</span><span class="cr-val">'+esc(gbp(l.value))+'</span></div>'+
          (l.contact?'<div class="cr-contact">'+esc(l.contact)+'</div>':'')+
          (l.next_action?'<div class="cr-next"><b>Next</b>'+esc(l.next_action)+'</div>':'')+
          (l.notes?'<div class="cr-notes">'+esc(l.notes)+'</div>':'')+
        '</div>';
      }).join('') : '<div class="cr-empty">Nothing in '+st[1].toLowerCase()+'</div>';
      return '<div class="cr-stage"><div class="cr-stage-h">'+st[1]+' <b>'+rows.length+'</b></div><div class="cr-cards">'+cards+'</div></div>';
    }).join('');
    host.querySelectorAll('.cr-card').forEach(function(c){
      c.addEventListener('click', function(){ openModal(leads.find(function(l){return l.id===c.getAttribute('data-id')})); });
    });
  }

  async function load(){
    clearErr();
    var client = sb();
    if (!client){ err('Supabase client unavailable — reload.'); return; }
    var res = await client.from('cc_leads').select('*').order('updated_at',{ascending:false});
    if (res.error){ err('Pipeline failed to load: '+res.error.message); return; }
    leads = res.data || [];
    render();
  }

  // ---- modal (body-appended per §23.121) ----
  var overlay = null;
  function closeModal(){ if (overlay){ overlay.remove(); overlay=null; } }
  function openModal(lead){
    closeModal();
    var isNew = !lead;
    lead = lead || {};
    overlay = document.createElement('div');
    overlay.className = 'cr-overlay';
    overlay.innerHTML =
      '<div class="cr-modal">'+
        '<div class="cr-mh"><h3>'+(isNew?'Add lead':'Edit lead')+'</h3></div>'+
        '<div class="cr-mb">'+
          '<div class="cr-field"><label>Company</label><input class="cr-in" id="m-company" value="'+esc(lead.company||'')+'"></div>'+
          '<div class="cr-two">'+
            '<div class="cr-field"><label>Contact</label><input class="cr-in" id="m-contact" value="'+esc(lead.contact||'')+'"></div>'+
            '<div class="cr-field"><label>Email</label><input class="cr-in" id="m-email" value="'+esc(lead.email||'')+'"></div>'+
          '</div>'+
          '<div class="cr-two">'+
            '<div class="cr-field"><label>Stage</label><select class="cr-in" id="m-stage">'+
              STAGES.map(function(s){return '<option value="'+s[0]+'"'+(lead.stage===s[0]?' selected':'')+'>'+s[1]+'</option>'}).join('')+
            '</select></div>'+
            '<div class="cr-field"><label>Value £/mo</label><input class="cr-in" id="m-value" type="number" min="0" step="1" value="'+(lead.value!=null?esc(lead.value):'')+'"></div>'+
          '</div>'+
          '<div class="cr-field"><label>Next action</label><input class="cr-in" id="m-next" value="'+esc(lead.next_action||'')+'"></div>'+
          '<div class="cr-field"><label>Notes</label><textarea class="cr-in" id="m-notes">'+esc(lead.notes||'')+'</textarea></div>'+
        '</div>'+
        '<div class="cr-mf">'+
          (isNew?'<span></span>':'<button class="cr-btn danger" id="m-delete">Delete</button>')+
          '<div class="cr-mf-right">'+
            '<button class="cr-btn secondary" id="m-cancel">Cancel</button>'+
            '<button class="cr-btn primary" id="m-save">'+(isNew?'Add lead':'Save changes')+'</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if (e.target===overlay) closeModal(); });
    overlay.querySelector('#m-cancel').addEventListener('click', closeModal);

    overlay.querySelector('#m-save').addEventListener('click', async function(){
      var company = overlay.querySelector('#m-company').value.trim();
      if (!company){ overlay.querySelector('#m-company').focus(); return; }
      var stage = overlay.querySelector('#m-stage').value;
      if (STAGE_SET.indexOf(stage) < 0) stage = 'prospect';
      var valRaw = overlay.querySelector('#m-value').value;
      var payload = {
        company: company,
        contact: overlay.querySelector('#m-contact').value.trim() || null,
        email: overlay.querySelector('#m-email').value.trim() || null,
        stage: stage,
        value: valRaw === '' ? null : Number(valRaw),
        next_action: overlay.querySelector('#m-next').value.trim() || null,
        notes: overlay.querySelector('#m-notes').value.trim() || null,
        updated_at: new Date().toISOString()
      };
      var btn = this; btn.disabled = true; btn.textContent = 'Saving…';
      var client = sb(); var res;
      if (isNew){
        try { var s = await client.auth.getSession(); payload.created_by = s.data.session.user.email; } catch(_){}
        res = await client.from('cc_leads').insert(payload);
      } else {
        res = await client.from('cc_leads').update(payload).eq('id', lead.id);
      }
      if (res.error){ btn.disabled=false; btn.textContent=isNew?'Add lead':'Save changes'; err('Save failed: '+res.error.message); return; }
      closeModal(); clearErr(); load();
    });

    var del = overlay.querySelector('#m-delete');
    if (del) del.addEventListener('click', async function(){
      if (!confirm('Delete '+(lead.company||'this lead')+'? This cannot be undone.')) return;
      var res = await sb().from('cc_leads').delete().eq('id', lead.id);
      if (res.error){ err('Delete failed: '+res.error.message); return; }
      closeModal(); clearErr(); load();
    });
  }

  el('cr-add').addEventListener('click', function(){ openModal(null); });
  load();
})();
</script>
