<div class="page active" id="page-org">
  <div class="page-hero">
    <div class="eyebrow">Run the Company</div>
    <h1 class="page-title">Org</h1>
    <p class="page-sub">Action plans, team, settings. The shared operating system.</p>
  </div>

  <div class="hub-tiles" id="hub-org-tiles"></div>

  <!-- Team roster with action-plan health -->
  <div class="card" style="margin-top:18px">
    <div class="card-header"><div class="card-title">Team</div><div class="card-sub" id="org-team-sub">Loading…</div></div>
    <div id="org-team-roster" class="card-body" style="padding:0"></div>
  </div>
</div>

<style>
  .hub-tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 8px;
  }
  @media (max-width: 1100px) { .hub-tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .hub-tiles { grid-template-columns: 1fr; } }

  .hub-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 22px 22px 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
    text-decoration: none;
    color: inherit;
    position: relative;
    min-height: 156px;
  }
  .hub-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--vyve-teal-pale);
    color: inherit;
  }
  .hub-tile .tile-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .hub-tile .tile-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--r-md);
    background: var(--vyve-teal-pale);
    color: var(--vyve-teal);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hub-tile .tile-icon svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hub-tile .tile-badge {
    font-size: var(--fs-2xs);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    flex-shrink: 0;
  }
  .hub-tile .tile-label {
    font-family: var(--font-head);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1.2;
    margin-top: 2px;
  }
  .hub-tile .tile-metric-row {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  .hub-tile .tile-primary {
    font-family: var(--font-head);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1;
  }
  .hub-tile .tile-secondary {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-align: right;
    line-height: 1.3;
    max-width: 50%;
  }
  .hub-tile .tile-arrow {
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity var(--t-fast), transform var(--t-fast);
  }
  .hub-tile:hover .tile-arrow {
    opacity: 1;
    transform: translateX(2px);
    color: var(--vyve-teal);
  }
</style>

<script>
(function(){
  if (!window.VYVE_DATA) { console.error('[hub-org] VYVE_DATA not loaded'); return; }
  var D = window.VYVE_DATA;
  var ICONS = window.VYVE_ICONS || {};
  var tiles = [{"slug": "action-plans", "label": "Action Plans", "icon": "target", "primary": "(D.actions.completionPct() || 0) + '%'", "secondary": "(function(){ var o = D.actions.overdue().length; var s = D.actions.dueSoon(14).length; return o + ' overdue  \\u00b7  ' + s + ' due 14d'; })()", "badge": "(function(){ var o = D.actions.overdue().length; return o ? '<span class=\"tile-badge badge-red\">' + o + ' overdue</span>' : '<span class=\"tile-badge badge-teal\">live</span>'; })()"}, {"slug": "team", "label": "Team", "icon": "user", "primary": "10", "secondary": "'members tracked'", "badge": null}, {"slug": "settings", "label": "Settings", "icon": "settings", "primary": "'\\u2014'", "secondary": "'Make, Supabase, theme'", "badge": null}];
  var arrow = '<svg class="tile-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  function safe(fn){ try { return fn(); } catch(e){ console.warn('tile metric error', e); return ''; } }

  function renderTile(t){
    var icon = ICONS[t.icon] || '';
    var primary = safe(function(){ return eval(t.primary); }) || '—';
    var secondary = safe(function(){ return eval(t.secondary); }) || '';
    var badge = t.badge ? safe(function(){ return eval(t.badge); }) : '';
    return '<a class="hub-tile" href="#/' + t.slug + '">' +
      '<div class="tile-head">' +
        '<div class="tile-icon">' + icon + '</div>' +
        (badge || '') +
      '</div>' +
      '<div class="tile-label">' + t.label + '</div>' +
      '<div class="tile-metric-row">' +
        '<div class="tile-primary">' + primary + '</div>' +
        '<div class="tile-secondary">' + secondary + '</div>' +
      '</div>' +
      arrow +
    '</a>';
  }

  document.getElementById('hub-org-tiles').innerHTML = tiles.map(renderTile).join('');

  function renderRoster(){
    var members = D.actions.byMember ? D.actions.byMember() : [];
    var sub = document.getElementById('org-team-sub');
    if (!members.length){
      sub.textContent = 'No team data';
      document.getElementById('org-team-roster').innerHTML = '<div class="empty" style="padding:24px"><p>No team members or action plans found. See Action Plans page.</p></div>';
      return;
    }
    sub.textContent = members.length + ' team members';
    document.getElementById('org-team-roster').innerHTML = members.map(function(m){
      var actions = m.actions || [];
      var done = actions.filter(function(a){ return a.status === 'done'; }).length;
      var blocked = actions.filter(function(a){ return a.status === 'blocked'; }).length;
      var total = actions.length;
      var pct = total > 0 ? Math.round((done / total) * 100) : 0;
      var pctColor = pct >= 60 ? 'var(--success)' : (pct >= 30 ? 'var(--warning)' : 'var(--danger)');
      var initial = (m.name || '?').charAt(0).toUpperCase();
      return '<a class="list-row" href="#/action-plans" style="padding:14px 22px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px">' +
        '<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg, var(--vyve-teal), var(--vyve-teal-light));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:15px;flex-shrink:0">' + initial + '</div>' +
        '<div class="list-row-main" style="flex:1">' +
          '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px"><div style="font-weight:600">' + (m.name || '—') + '</div><div style="font-size:11px;color:var(--text-muted)">' + (m.role || '') + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text-muted)"><span>' + done + '/' + total + ' actions</span>' + (blocked ? '<span style="color:var(--danger);font-weight:600">' + blocked + ' blocked</span>' : '') + '</div>' +
        '</div>' +
        '<div style="width:140px;flex-shrink:0">' +
          '<div style="font-size:11px;color:' + pctColor + ';font-weight:700;text-align:right;margin-bottom:3px">' + pct + '%</div>' +
          '<div style="height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:' + pctColor + '"></div></div>' +
        '</div>' +
      '</a>';
    }).join('');
  }

  renderRoster();
})();
</script>
