<div class="page active" id="page-action-plans" style="max-width:1280px">
  <div class="page-hero">
    <div class="eyebrow">Team Operating System</div>
    <h1 class="page-title">Action Plans</h1>
    <p class="page-sub">10 team members &middot; 15 priority actions each. The 150 things that make VYVE successful, tracked together.</p>

    <div></div>

  <!-- KPIs -->

  <!-- Members + actions -->
  <div id="ap-members"></div>
</div>

<style>
  /* ===================================================================
     PM-1016 (CC design system, Wave 4): the .ap-* rules that lived at the
     tail of assets/components.css are merged in here, where they belong —
     they were never primitives. MERGED, not appended: the router injects
     this <style> after components.css, so every selector this page already
     defined was already winning on source order. Only the declarations
     components.css uniquely supplied have been added.

     The mobile block below deliberately keeps BOTH its !important flags and
     its max-width query. Those rules exist to beat inline styles emitted by
     the renderer further down this file (.ap-member-head, .ap-action-row and
     .ap-status-pill are all written with an inline style= by renderMember /
     renderAction). Min-width authoring cannot express that without hardcoding
     the renderer's inline values into CSS, so Law 1 yields here exactly as it
     yielded for shell.css in Wave 0. Logged, not accidental.
     =================================================================== */

  /* Preserved from components.css. Zero DOM consumers today — the renderer
     emits class="ap-member card", not "ap-member-card". Kept rather than
     dropped (soft-kill discipline). */
  .ap-member-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-xs);
    transition: box-shadow var(--t-fast), border-color var(--t-fast);
  }
  .ap-member-card:hover { box-shadow: var(--shadow-sm); }
  .ap-member-card.open { border-color: var(--accent); }

  /* The renderer's inline style supplies display/align-items/gap/padding/cursor.
     These two are the only declarations components.css uniquely contributed. */
  .ap-member-head { user-select: none; transition: background var(--t-fast); }
  .ap-member-head:hover { background: var(--surface-2); }

  .ap-action-row { transition: background .15s; }
  .ap-action-row:hover { background: var(--surface-2); }

  /* flex-shrink came from components.css; the rest is this page's own rule. */
  .ap-progress-track { width: 120px; height: 6px; background: var(--surface-2); border-radius: var(--r-sm); overflow: hidden; flex-shrink: 0; }
  .ap-progress-fill { height: 100%; background: linear-gradient(90deg, var(--vyve-teal), var(--vyve-teal-light)); transition: width .3s; }

  .ap-status-pill { flex-shrink: 0; font-size: var(--fs-2xs); font-weight: 600; padding: 4px 10px; border-radius: var(--r-lg); min-width: 96px; text-align: center; text-transform: uppercase; letter-spacing: .4px; }

  .ap-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--vyve-teal), var(--vyve-teal-light)); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 700; color: #fff; font-size: var(--fs-base); flex-shrink: 0; box-shadow: var(--shadow-xs); }
  .ap-avatar.physical { background: linear-gradient(135deg, var(--pillar-physical), #E5B454); }
  .ap-avatar.mental   { background: linear-gradient(135deg, var(--pillar-mental), #6BC2C2); }
  .ap-avatar.social   { background: linear-gradient(135deg, var(--pillar-social), #E59A89); }

  /* Base .ap-filter came from components.css and had no page-local copy —
     it is live and moves across whole. The filter buttons also carry
     .btn.btn-ghost; .ap-filter sat after .btn-ghost in components.css and
     still sits after it here, so the cascade order is unchanged.
     NOTE: --vyve-teal-dark on .active is undefined repo-wide (pre-existing,
     reported separately) — left exactly as it renders today. */
  .ap-filter {
    padding: 6px 14px;
    border-radius: var(--r-pill);
    font-size: var(--fs-sm);
    font-weight: var(--fw-medium);
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all var(--t-fast);
  }
  .ap-filter:hover { color: var(--text); }
  .ap-filter.active { background: var(--vyve-teal-dark); color: var(--text); border-color: var(--vyve-teal); font-weight: var(--fw-semi); }

  .ap-edit-form .form-group { margin-bottom: 14px; }
  .ap-edit-form label { display: block; font-size: var(--fs-2xs); color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; font-weight: 600; }
  .ap-edit-form input[type="date"], .ap-edit-form select, .ap-edit-form textarea {
    width: 100%; padding: 9px 11px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
    color: var(--text); font-family: var(--font-body); font-size: var(--fs-sm);
  }
  .ap-edit-form textarea { resize: vertical; min-height: 90px; }
  .ap-edit-form input[type="range"] { width: 100%; accent-color: var(--vyve-teal-light); }
  .ap-edit-form .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ap-action-text { font-size: var(--fs-sm); line-height: 1.55; color: var(--text); }
  .ap-action-text.done { opacity: .6; text-decoration: line-through; }

  /* Moved verbatim from components.css — see the note at the top of this block
     for why the !important flags and the max-width query both stay. */
  @media (max-width: 720px) {
    .ap-member-head {
      flex-wrap: wrap !important;
      gap: 12px !important;
      padding: 16px !important;
      min-height: 56px;
    }
    .ap-member-head > div:last-child {
      width: 100%;
      justify-content: space-between !important;
    }
    .ap-progress-track { display: none; }
    .ap-action-row {
      flex-wrap: wrap !important;
      padding: 14px 16px !important;
    }
    .ap-status-pill {
      min-width: auto !important;
      padding: 5px 11px !important;
      font-size: var(--fs-xs) !important;
    }
    .ap-avatar { width: 40px !important; height: 40px !important; }
    .ap-filter { padding: 7px 13px !important; }
    .ap-edit-form .form-row { grid-template-columns: 1fr !important; }
  }
</style>

  function loadOverrides(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}') || {}; } catch(e){ return {}; } }
  function saveOverride(actionId, patch){
    var saved = loadOverrides();
    var before = saved[actionId] || {};
    saved[actionId] = Object.assign({}, before, patch, { updated_at: new Date().toISOString() });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch(e){}
    // Audit trail
    if (window.VYVE_STORE) {
      var op = Object.keys(before).length ? 'update' : 'create';
      window.VYVE_STORE.logChange('action', actionId, null, op, patch);

            position: idx + 1,
            text: text,
            status: override.status || 'not-started',
            due: override.due || '',
            progress: typeof override.progress === 'number' ? override.progress : 0,
            notes: override.notes || '',

            notes: a.notes, updated_at: a.updated_at
          });
        });
      });
      localStorage.setItem(FULL_CACHE, JSON.stringify(flat));
    } catch(e){}
    return result;
  }

  function parseDate(s){ if (!s) return null; var d = new Date(s); return isNaN(d.getTime()) ? null : d; }
  function startOfDay(d){ d = d || new Date(); var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function daysUntil(s){ var d = parseDate(s); return d ? Math.ceil((d - startOfDay()) / 86400000) : null; }
  function fmtDate(s){
    var d = parseDate(s); if (!d) return '';
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
  }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function actionMatchesFilter(a, f){
    if (f === 'all') return true;
    if (f === 'overdue'){ var du = daysUntil(a.due); return du !== null && du < 0 && a.status !== 'done'; }
    if (f === 'due-soon'){ var du = daysUntil(a.due); return du !== null && du >= 0 && du <= 14 && a.status !== 'done'; }
    return a.status === f;
  }

  function memberProgress(member){
    var total = member.actions.length;
    var done = member.actions.filter(function(a){ return a.status === 'done'; }).length;
    var inProgress = member.actions.filter(function(a){ return a.status === 'in-progress'; }).length;
    var blocked = member.actions.filter(function(a){ return a.status === 'blocked'; }).length;
    var pct = total ? Math.round((done + inProgress * 0.5) / total * 100) : 0;
    return { total: total, done: done, inProgress: inProgress, blocked: blocked, pct: pct };
  }

  var state = buildState();
  var expanded = loadExpanded();
  var currentFilter = loadFilter();

  function renderKPIs(){
    var all = state.reduce(function(arr, m){ return arr.concat(m.actions); }, []);
    var total = all.length;
    var done = all.filter(function(a){ return a.status === 'done'; }).length;
    var inProgress = all.filter(function(a){ return a.status === 'in-progress'; }).length;
    var blocked = all.filter(function(a){ return a.status === 'blocked'; }).length;
    var overdue = all.filter(function(a){ var du = daysUntil(a.due); return du !== null && du < 0 && a.status !== 'done'; }).length;
    var pct = total ? Math.round(done / total * 100) : 0;
    document.getElementById('ap-kpis').innerHTML =
      '<div class="stat"><div class="stat-num">' + pct + '%</div><div class="stat-label">Complete</div><div class="stat-sub">' + done + ' of ' + total + ' done</div></div>' +
      '<div class="stat"><div class="stat-num" style="color:var(--vyve-teal-light)">' + inProgress + '</div><div class="stat-label">In progress</div><div class="stat-sub">being worked on</div></div>' +
      '<div class="stat"><div class="stat-num" style="color:' + (blocked ? '#e06060' : 'var(--text)') + '">' + blocked + '</div><div class="stat-label">Blocked</div><div class="stat-sub">' + (blocked ? 'needs unblocking' : 'all clear') + '</div></div>' +
      '<div class="stat"><div class="stat-num" style="color:' + (overdue ? '#e06060' : 'var(--text)') + '">' + overdue + '</div><div class="stat-label">Overdue</div><div class="stat-sub">past deadline</div></div>';
  }

  function renderMembers(){
    var html = '';
    state.forEach(function(member){
      var prog = memberProgress(member);
      var isOpen = !!expanded[member.id];
      var visible = member.actions.filter(function(a){ return actionMatchesFilter(a, currentFilter); });
      var hidden = member.actions.length - visible.length;

      html += '<div class="ap-member card" data-member="' + member.id + '" style="padding:0;margin-bottom:12px;overflow:hidden">';
      html += '<div class="ap-member-head" data-toggle="' + member.id + '" style="display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer">';
      var memberPillar = ({
        'tm_calum': 'physical',
        'tm_phil': 'mental',
        'tm_lewis': '',
        'tm_dean': 'mental',
        'tm_alan': 'mental',
        'tm_ryan': 'mental',
        'tm_vicki': 'social',
        'tm_cole': 'social',
        'tm_azuza': 'social',
        'tm_hr': '',
        'tm_team_advisor': ''
      })[member.id] || '';
      html += '<div class="ap-avatar' + (memberPillar ? ' ' + memberPillar : '') + '">' + esc(member.name.charAt(0)) + '</div>';
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-family:var(--font-head);font-weight:600;color:var(--text);font-size:15px">' + esc(member.name) + '</div>';
      html += '<div style="font-size:11.5px;color:var(--text-muted)">' + esc(member.role) + '</div>';
      html += '</div>';
      html += '<div style="display:flex;align-items:center;gap:14px;flex-shrink:0">';
      html += '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">';
      html += '<div style="font-family:var(--font-head);font-weight:600;color:var(--text);font-size:14px">' + prog.pct + '%</div>';
      html += '<div style="display:flex;gap:6px;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px">';
      html += '<span>' + prog.done + ' done</span>';
      if (prog.inProgress) html += '<span>&middot; ' + prog.inProgress + ' active</span>';
      if (prog.blocked) html += '<span style="color:#e06060">&middot; ' + prog.blocked + ' blocked</span>';
      html += '</div></div>';
      html += '<div class="ap-progress-track"><div class="ap-progress-fill" style="width:' + prog.pct + '%"></div></div>';
      html += '<div style="color:var(--text-muted);font-size:18px;transform:rotate(' + (isOpen ? '90' : '0') + 'deg);transition:.2s;line-height:1">&rsaquo;</div>';
      html += '</div></div>';

      html += '<div data-body="' + member.id + '" style="display:' + (isOpen ? 'block' : 'none') + ';border-top:1px solid var(--border);padding:8px 0">';
      html += '<div style="padding:10px 18px 4px;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">' + esc(member.responsibility) + '</div>';
      if (!visible.length){
        html += '<div class="empty" style="padding:18px;text-align:left"><h3 style="margin:0;font-size:13px;font-weight:500">No actions match the current filter.</h3>';
        if (hidden) html += '<p style="margin:4px 0 0;font-size:11.5px">(' + hidden + ' hidden)</p>';
        html += '</div>';
      } else {
        visible.forEach(function(action){ html += renderActionRow(member, action); });
        if (hidden){
          html += '<div style="padding:8px 18px;font-size:11px;color:var(--text-muted);font-style:italic">' + hidden + ' more action' + (hidden > 1 ? 's' : '') + ' hidden by current filter</div>';
        }
      }
      html += '</div></div>';
    });
    document.getElementById('ap-members').innerHTML = html;
    wireRows();
  }

  function renderActionRow(member, action){
    var du = daysUntil(action.due);
    var dueColor = du === null ? 'var(--text-muted)' : (du < 0 && action.status !== 'done') ? '#e06060' : du <= 7 ? 'var(--vyve-gold)' : 'var(--text-muted)';
    var dueText = action.due ? fmtDate(action.due) + (du !== null && du < 0 && action.status !== 'done' ? ' &middot; overdue' : du !== null && du >= 0 && du <= 14 && action.status !== 'done' ? ' &middot; ' + du + 'd left' : '') : '';
    var doneCls = action.status === 'done' ? ' done' : '';

    var html = '<div class="ap-action-row" data-action="' + action.id + '" style="display:flex;align-items:flex-start;gap:14px;padding:12px 18px;border-top:1px solid var(--border);cursor:pointer">';
    html += '<div class="ap-status-pill" style="' + STATUS_STYLES[action.status] + ';margin-top:1px">' + STATUS_LABELS[action.status] + '</div>';
    html += '<div style="flex:1;min-width:0">';
    html += '<div class="ap-action-text' + doneCls + '"><span style="color:var(--text-muted);font-family:var(--font-head);font-weight:700;margin-right:8px">' + action.position + '.</span>' + esc(action.text) + '</div>';
    var meta = [];
    if (action.due) meta.push('<span style="color:' + dueColor + '">' + dueText + '</span>');
    if (action.progress) meta.push('<span style="color:var(--vyve-teal-light)">' + action.progress + '% progress</span>');
    if (action.notes) meta.push('<span style="color:var(--text-muted)" title="' + esc(action.notes) + '">&#9636; has notes</span>');
    if (meta.length){
      html += '<div style="font-size:11px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap">' + meta.join('') + '</div>';
    }
    html += '</div>'; // close flex:1 inner div
    var ccount = (window.VYVE_COMMENTS ? window.VYVE_COMMENTS.count('action', action.id) : 0);
    html += '<button type="button" class="ap-discuss-btn" data-discuss="' + action.id + '" title="Comments &amp; history" ' +
            'style="flex-shrink:0;padding:5px 10px;border-radius:999px;background:' + (ccount ? 'var(--vyve-teal-pale)' : 'transparent') + ';color:' + (ccount ? 'var(--vyve-teal)' : 'var(--text-muted)') + ';font-size:11px;font-weight:600;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;align-self:flex-start;margin-top:1px">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' +
            (ccount || 'Discuss') +
            '</button>';
    html += '</div>';
    return html;
  }

  function wireRows(){
    document.querySelectorAll('[data-toggle]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-toggle');
        expanded[id] = !expanded[id];
        saveExpanded(expanded);
        renderMembers();
      });
    });
    document.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', function(e){
        // If they clicked the discuss button, don't open the edit modal
        if (e.target.closest && e.target.closest('[data-discuss]')) return;
        e.stopPropagation();
        openEditModal(el.getAttribute('data-action'));
      });
    });
    // Discuss button -> open record modal with Comments + History tabs
    document.querySelectorAll('[data-discuss]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-discuss');
        if (window.VYVE_WIDGETS && window.VYVE_WIDGETS.recordModal) {
          window.VYVE_WIDGETS.recordModal('action', id);
        }
      });
    });
  }

  function findAction(id){
    for (var i = 0; i < state.length; i++){
      for (var j = 0; j < state[i].actions.length; j++){
        if (state[i].actions[j].id === id) return { member: state[i], action: state[i].actions[j] };
      }
    }
    return null;
  }

  function openEditModal(actionId){
    var found = findAction(actionId);
    if (!found) return;
    var a = found.action, m = found.member;

    var bodyHtml =
      '<div class="ap-edit-form">' +
        '<div class="form-group">' +
          '<label>' + esc(m.name) + ' &middot; action ' + a.position + '</label>' +
          '<div style="font-size:13px;line-height:1.6;color:var(--text);background:var(--surface-2);padding:12px 14px;border-radius:var(--r-sm);margin-top:4px">' + esc(a.text) + '</div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group">' +
            '<label for="apm-status">Status</label>' +
            '<select id="apm-status">' +
              '<option value="not-started"' + (a.status === 'not-started' ? ' selected' : '') + '>Not started</option>' +
              '<option value="in-progress"' + (a.status === 'in-progress' ? ' selected' : '') + '>In progress</option>' +
              '<option value="blocked"' + (a.status === 'blocked' ? ' selected' : '') + '>Blocked</option>' +
              '<option value="done"' + (a.status === 'done' ? ' selected' : '') + '>Done</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-group">' +
            '<label for="apm-due">Deadline</label>' +
            '<input type="date" id="apm-due" value="' + (a.due ? a.due.slice(0,10) : '') + '"/>' +
          '</div>' +
        '</div>' +
        '<div class="form-group">' +
          '<label for="apm-progress">Progress</label>' +
          '<input type="range" id="apm-progress" min="0" max="100" step="5" value="' + (a.progress || 0) + '"/>' +
          '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px">' +
            '<span>0%</span><span id="apm-progress-val" style="color:var(--text);font-weight:600">' + (a.progress || 0) + '%</span><span>100%</span>' +
          '</div>' +
        '</div>' +
        '<div class="form-group">' +
          '<label for="apm-notes">Notes &amp; progress log</label>' +
          '<textarea id="apm-notes" rows="4" placeholder="What is done, what is blocking, next step...">' + esc(a.notes || '') + '</textarea>' +
        '</div>' +
        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px">' +
          '<button class="btn btn-ghost" id="apm-cancel" type="button">Cancel</button>' +
          '<button class="btn btn-primary" id="apm-save" type="button">Save changes</button>' +
        '</div>' +
      '</div>';

    var modalRef = VYVE_UI.modal({ title: 'Edit action', body: bodyHtml });

    var progressInput = document.getElementById('apm-progress');
    var progressVal = document.getElementById('apm-progress-val');
    progressInput.addEventListener('input', function(){ progressVal.textContent = progressInput.value + '%'; });
    document.getElementById('apm-status').addEventListener('change', function(e){
      if (e.target.value === 'done'){ progressInput.value = 100; progressVal.textContent = '100%'; }
      else if (e.target.value === 'not-started'){ progressInput.value = 0; progressVal.textContent = '0%'; }
    });
    document.getElementById('apm-cancel').addEventListener('click', modalRef.close);
    document.getElementById('apm-save').addEventListener('click', function(){
      var newStatus = document.getElementById('apm-status').value;
      var newDue = document.getElementById('apm-due').value;
      var newProgress = parseInt(progressInput.value, 10) || 0;
      var newNotes = document.getElementById('apm-notes').value;
      if (newStatus === 'done' && newProgress < 100) newProgress = 100;
      if (newStatus === 'not-started' && newProgress > 0) newProgress = 0;
      saveOverride(actionId, { status: newStatus, due: newDue, progress: newProgress, notes: newNotes });
      state = buildState();
      modalRef.close();
      renderAll();
      VYVE_UI.toast('Saved', 'success');
    });
  }

  function wireFilters(){
    document.querySelectorAll('.ap-filter').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('.ap-filter').forEach(function(x){ x.classList.remove('active'); });
        b.classList.add('active');
        currentFilter = b.getAttribute('data-filter');
        saveFilter(currentFilter);
        renderMembers();
      });
      b.classList.toggle('active', b.getAttribute('data-filter') === currentFilter);
    });
  }

  document.getElementById('ap-expand-all').addEventListener('click', function(){
    var anyOpen = state.some(function(m){ return expanded[m.id]; });
    if (anyOpen) expanded = {};
    else state.forEach(function(m){ expanded[m.id] = true; });
    saveExpanded(expanded);
    document.getElementById('ap-expand-all').textContent = anyOpen ? 'Expand all' : 'Collapse all';
    renderMembers();
  });

  document.getElementById('ap-export').addEventListener('click', function(){
    var data = state.map(function(m){
      return { member: m.name, role: m.role,
        actions: m.actions.map(function(a){
          return { position: a.position, text: a.text, status: a.status, due: a.due, progress: a.progress, notes: a.notes };
        })
      };
    });
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'vyve-action-plans-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 100);
    VYVE_UI.toast('Exported', 'success');
  });

  function renderAll(){
    renderKPIs();
    renderMembers();
    var anyOpen = state.some(function(m){ return expanded[m.id]; });
    document.getElementById('ap-expand-all').textContent = anyOpen ? 'Collapse all' : 'Expand all';
  }

  renderAll();
  wireFilters();
})();
</script>
