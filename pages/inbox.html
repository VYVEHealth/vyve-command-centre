<!-- =====================================================================
     VYVE Command Centre — Inbox (PM-910)
     Messenger-style partner support: thread list + chat view + reply.
     Data: partner_support_messages / partner_support_replies (admin RLS);
     replies go through the partner-support EF (emails + limits enforced).
     ===================================================================== -->
<style>
.ib-wrap{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--border);border-radius:var(--card-radius);background:var(--surface);box-shadow:var(--shadow-md);overflow:hidden;min-height:560px;height:calc(100vh - 190px)}
.ib-wrap.showing-conv .ib-list{display:none}
.ib-wrap:not(.showing-conv) .ib-conv{display:none}
.ib-list{border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.ib-list-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ib-list-head h3{font-size:var(--fs-base);font-weight:700}
.ib-count{font-size:var(--fs-2xs);font-weight:700;background:var(--danger-pale,#fbe9e9);color:var(--danger,#c0392b);border-radius:var(--r-pill);padding:2px 9px}
.ib-thread{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.ib-thread:hover{background:var(--surface-2)}
.ib-thread.active{background:var(--accent-pale)}
.ib-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--vyve-teal,#4DAAAA),var(--vyve-teal-light,#6FB8B8));color:#fff;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;flex-shrink:0;text-transform:uppercase}
.ib-tmain{flex:1;min-width:0}
.ib-tname{font-size:var(--fs-sm);font-weight:700;display:flex;align-items:center;gap:6px}
.ib-tsnip{font-size:var(--fs-xs);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ib-ttime{font-size:var(--fs-2xs);color:var(--text-dim);font-family:var(--font-mono);flex-shrink:0}
.ib-dot{width:8px;height:8px;border-radius:50%;background:var(--danger,#c0392b);flex-shrink:0}
.ib-chip{font-size:var(--fs-2xs);font-weight:700;border-radius:var(--r-pill);padding:1px 7px;text-transform:uppercase;letter-spacing:.06em}
.ib-chip.open{background:var(--danger-pale,#fbe9e9);color:var(--danger,#c0392b)}
.ib-chip.replied{background:var(--success-pale,#e7f5e7);color:var(--success,#3a9c3a)}
.ib-chip.closed{background:var(--surface-2);color:var(--text-muted)}
.ib-conv{display:flex;flex-direction:column;min-width:0}
.ib-conv-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.ib-conv-head .ib-back{display:block;background:none;border:0;font-size:var(--fs-lg);cursor:pointer;color:var(--text)}
.ib-conv-title{flex:1;min-width:0}
.ib-conv-title b{font-size:var(--fs-base)}
.ib-conv-sub{font-size:var(--fs-2xs);color:var(--text-muted)}
.ib-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ib-bubble{max-width:88%;padding:10px 14px;border-radius:var(--r-lg);font-size:var(--fs-sm);line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ib-bubble.partner{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
.ib-bubble.admin{align-self:flex-end;background:var(--vyve-teal,#4DAAAA);color:#fff;border-bottom-right-radius:5px}
.ib-meta{font-size:var(--fs-2xs);color:var(--text-dim);margin-top:5px;font-family:var(--font-mono)}
.ib-bubble.admin .ib-meta{color:rgba(255,255,255,.75)}
.ib-compose{border-top:1px solid var(--border);padding:12px 14px;display:flex;gap:10px;align-items:flex-end;background:var(--surface)}
.ib-compose textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--input-radius);background:var(--bg);color:var(--text);padding:10px 12px;font-size:var(--fs-sm);font-family:inherit;min-height:44px;max-height:140px}
.ib-empty{display:grid;place-items:center;color:var(--text-muted);font-size:var(--fs-sm);height:100%;padding:30px;text-align:center}
@media(min-width:900px){
  .ib-wrap{grid-template-columns:320px 1fr;height:calc(100vh - 220px)}
  .ib-wrap.showing-conv .ib-list{display:flex}
  .ib-wrap:not(.showing-conv) .ib-conv{display:flex}
  .ib-conv-head .ib-back{display:none}
  .ib-bubble{max-width:76%}
}
</style>

<div class="hm-head" style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px">
  <div>
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Messages</div>
    <div style="font-size:25px;font-weight:700;letter-spacing:-.015em">Inbox</div>
    <div style="font-size:13px;color:var(--text-muted)">Partner messages, answered like a conversation. Replies also email the partner.</div>
  </div>
</div>

<div class="ib-wrap" id="ib-wrap">
  <div class="ib-list">
    <div class="ib-list-head"><h3>Conversations</h3><span class="ib-count" id="ib-open-count" style="display:none">0</span></div>
    <div id="ib-threads"><div class="ib-empty">Loading…</div></div>
  </div>
  <div class="ib-conv">
    <div class="ib-conv-head" id="ib-conv-head" style="display:none">
      <button class="ib-back" id="ib-back" type="button" aria-label="Back">&larr;</button>
      <span class="ib-av" id="ib-conv-av">?</span>
      <div class="ib-conv-title"><b id="ib-conv-name">—</b><div class="ib-conv-sub" id="ib-conv-sub"></div></div>
      <span class="ib-chip open" id="ib-conv-chip">open</span>
      <button class="btn btn-ghost btn-sm" id="ib-close-btn" type="button" title="Close this conversation">Close</button>
    </div>
    <div class="ib-msgs" id="ib-msgs"><div class="ib-empty">Pick a conversation on the left.<br/>New partner messages push to your phone the moment they arrive.</div></div>
    <div class="ib-compose" id="ib-compose" style="display:none">
      <textarea id="ib-text" placeholder="Write a reply…" rows="1"></textarea>
      <button class="btn btn-primary" id="ib-send" type="button">Send</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var S = window.VYVE_SUPABASE;
  var EF = 'https://ixjfklpckgxrwjlfsaaz.supabase.co/functions/v1/partner-support';
  var state = { threads: [], replies: {}, partners: {}, current: null };

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function initials(name){
    var parts = String(name || '?').trim().split(/\s+/);
    return (parts[0] ? parts[0][0] : '?') + (parts[1] ? parts[1][0] : '');
  }
  function ago(iso){
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'now';
    if (s < 3600) return Math.floor(s/60) + 'm';
    if (s < 86400) return Math.floor(s/3600) + 'h';
    return Math.floor(s/86400) + 'd';
  }
  function fmtTime(iso){
    var d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' ' +
      ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  }

  async function fetchAll(){
    var mr = await S.client.from('partner_support_messages')
      .select('id,partner_id,sender_email,subject,message,status,created_at')
      .order('created_at', { ascending: false });
    state.threads = mr.error ? [] : (mr.data || []);

    var rr = await S.client.from('partner_support_replies')
      .select('message_id,sender_role,sender_email,body,created_at')
      .order('created_at', { ascending: true });
    state.replies = {};
    (rr.error ? [] : (rr.data || [])).forEach(function(r){
      (state.replies[r.message_id] = state.replies[r.message_id] || []).push(r);
    });

    var ids = {};
    state.threads.forEach(function(t){ if (t.partner_id) ids[t.partner_id] = true; });
    var idList = Object.keys(ids);
    state.partners = {};
    if (idList.length){
      var pr = await S.client.from('partner_partners').select('id,name,slug').in('id', idList);
      (pr.error ? [] : (pr.data || [])).forEach(function(p){ state.partners[p.id] = p; });
    }
  }

  function lastActivity(t){
    var reps = state.replies[t.id] || [];
    return reps.length ? reps[reps.length - 1] : { body: t.message, created_at: t.created_at, sender_role: 'partner' };
  }
  function partnerName(t){
    var p = state.partners[t.partner_id];
    return (p && p.name) || t.sender_email || 'Unknown partner';
  }

  function renderList(){
    var host = el('ib-threads');
    // sort: open first, then most recent activity
    var sorted = state.threads.slice().sort(function(a, b){
      if ((a.status === 'open') !== (b.status === 'open')) return a.status === 'open' ? -1 : 1;
      return new Date(lastActivity(b).created_at) - new Date(lastActivity(a).created_at);
    });
    var open = state.threads.filter(function(t){ return t.status === 'open'; }).length;
    var badge = el('ib-open-count');
    badge.textContent = open;
    badge.style.display = open ? 'inline-flex' : 'none';

    if (!sorted.length){
      host.innerHTML = '<div class="ib-empty">No conversations yet.<br/>When a partner messages from their portal, it lands here.</div>';
      return;
    }
    host.innerHTML = sorted.map(function(t){
      var la = lastActivity(t);
      var snip = (la.sender_role === 'admin' ? 'You: ' : '') + la.body;
      return '<div class="ib-thread' + (state.current === t.id ? ' active' : '') + '" data-id="' + t.id + '">' +
        '<span class="ib-av">' + esc(initials(partnerName(t))) + '</span>' +
        '<div class="ib-tmain"><div class="ib-tname">' + esc(partnerName(t)) +
        (t.status === 'open' ? '<span class="ib-dot" title="Awaiting your reply"></span>' : '') + '</div>' +
        '<div class="ib-tsnip">' + esc(snip) + '</div></div>' +
        '<span class="ib-ttime">' + ago(la.created_at) + '</span></div>';
    }).join('');
    host.querySelectorAll('.ib-thread').forEach(function(n){
      n.addEventListener('click', function(){ openThread(n.getAttribute('data-id')); });
    });
  }

  function renderConv(){
    var t = state.threads.find(function(x){ return x.id === state.current; });
    if (!t) return;
    el('ib-conv-head').style.display = 'flex';
    el('ib-compose').style.display = (t.status === 'closed') ? 'none' : 'flex';
    el('ib-conv-av').textContent = initials(partnerName(t));
    el('ib-conv-name').textContent = partnerName(t);
    el('ib-conv-sub').textContent = (t.subject ? t.subject + ' · ' : '') + t.sender_email;
    var chip = el('ib-conv-chip');
    chip.textContent = t.status;
    chip.className = 'ib-chip ' + t.status;
    el('ib-close-btn').style.display = (t.status === 'closed') ? 'none' : 'inline-flex';

    var msgs = [{ sender_role: 'partner', body: t.message, created_at: t.created_at, sender_email: t.sender_email }]
      .concat(state.replies[t.id] || []);
    el('ib-msgs').innerHTML = msgs.map(function(m){
      var who = m.sender_role === 'admin' ? 'admin' : 'partner';
      var label = who === 'admin' ? ('VYVE · ' + esc(m.sender_email || '')) : esc(partnerName(t));
      return '<div class="ib-bubble ' + who + '">' + esc(m.body) +
        '<div class="ib-meta">' + label + ' · ' + fmtTime(m.created_at) + '</div></div>';
    }).join('');
    var box = el('ib-msgs');
    box.scrollTop = box.scrollHeight;
  }

  function openThread(id){
    state.current = id;
    el('ib-wrap').classList.add('showing-conv');
    renderList();
    renderConv();
  }

  async function sendReply(){
    var t = state.threads.find(function(x){ return x.id === state.current; });
    var ta = el('ib-text');
    var text = (ta.value || '').trim();
    if (!t || !text) return;
    var btn = el('ib-send');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      var sess = await S.client.auth.getSession();
      var jwt = sess && sess.data && sess.data.session && sess.data.session.access_token;
      var r = await fetch(EF, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jwt },
        body: JSON.stringify({ action: 'reply', message_id: t.id, body: text })
      });
      var d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.error || ('HTTP ' + r.status));
      ta.value = '';
      await fetchAll();
      renderList();
      renderConv();
      if (window.VYVE_UI && window.VYVE_UI.toast) window.VYVE_UI.toast('Reply sent — the partner has been emailed', 'success');
    } catch(e){
      alert('Reply failed: ' + (e.message || 'unknown'));
    } finally {
      btn.disabled = false; btn.textContent = 'Send';
    }
  }

  async function closeThread(){
    var t = state.threads.find(function(x){ return x.id === state.current; });
    if (!t) return;
    if (!confirm('Close this conversation? The partner can still reply, which reopens it.')) return;
    var res = await S.client.from('partner_support_messages').update({ status: 'closed' }).eq('id', t.id);
    if (res.error){ alert('Close failed: ' + res.error.message); return; }
    await fetchAll();
    renderList();
    renderConv();
  }

  async function boot(){
    if (!S || !S.isReady || !S.isReady()){ if (S && S.onReady) S.onReady(boot); return; }
    await fetchAll();
    renderList();
    el('ib-send').addEventListener('click', sendReply);
    el('ib-text').addEventListener('keydown', function(e){
      if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendReply(); }
    });
    el('ib-close-btn').addEventListener('click', closeThread);
    el('ib-back').addEventListener('click', function(){
      el('ib-wrap').classList.remove('showing-conv');
      state.current = null;
      renderList();
    });
    // gentle live-ish refresh while the page is open
    setInterval(async function(){
      if (document.hidden) return;
      var cur = state.current;
      await fetchAll();
      renderList();
      if (cur) renderConv();
    }, 30000);
  }
  boot();
})();
</script>
