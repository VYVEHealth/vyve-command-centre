<div class="page active" id="page-commercial">
  <div class="page-hero">
    <div class="eyebrow">Money in. Money out.</div>
    <h1 class="page-title">Commercial</h1>
    <p class="page-sub">Finance, pipeline, clients, investors, partners, invoicing. Everything commercial in one place.</p>
  </div>

  <div class="hub-tiles" id="hub-commercial-tiles"></div>
</div>

<style>
  .hub-tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 8px;
  }
  @media (max-width: 1100px) { .hub-tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .hub-tiles { grid-template-columns: 1fr; } }

  .hub-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 22px 22px 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
    text-decoration: none;
    color: inherit;
    position: relative;
    min-height: 156px;
  }
  .hub-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--vyve-teal-pale);
    color: inherit;
  }
  .hub-tile .tile-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .hub-tile .tile-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--r-md);
    background: var(--vyve-teal-pale);
    color: var(--vyve-teal);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hub-tile .tile-icon svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hub-tile .tile-badge {
    font-size: var(--fs-xxs);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    flex-shrink: 0;
  }
  .hub-tile .tile-label {
    font-family: var(--font-head);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1.2;
    margin-top: 2px;
  }
  .hub-tile .tile-metric-row {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  .hub-tile .tile-primary {
    font-family: var(--font-head);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1;
  }
  .hub-tile .tile-secondary {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-align: right;
    line-height: 1.3;
    max-width: 50%;
  }
  .hub-tile .tile-arrow {
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity var(--t-fast), transform var(--t-fast);
  }
  .hub-tile:hover .tile-arrow {
    opacity: 1;
    transform: translateX(2px);
    color: var(--vyve-teal);
  }
</style>

<script>
(function(){
  if (!window.VYVE_DATA) { console.error('[hub-commercial] VYVE_DATA not loaded'); return; }
  var D = window.VYVE_DATA;
  var ICONS = window.VYVE_ICONS || {};
  var tiles = [{"slug": "finance", "label": "Finance", "icon": "trending-up", "primary": "D.fmtGBP(D.finance.cash())", "secondary": "(function(){ var r = D.finance.runwayMonths(); return r != null ? r + ' months runway' : 'Cash on hand'; })()", "badge": null}, {"slug": "crm", "label": "Sales Pipeline", "icon": "users", "primary": "D.fmtGBP(D.deals.pipelineValue())", "secondary": "(function(){ var open = D.deals.all().filter(function(d){var s=(d.stage||'').toLowerCase(); return s!=='closed-won' && s!=='closed-lost';}).length; return open + ' open deals'; })()", "badge": null}, {"slug": "clients", "label": "Clients", "icon": "briefcase", "primary": "(function(){ return D.clients.live().length; })()", "secondary": "(function(){ var t = D.clients.all().length; return 'live  \\u00b7  ' + t + ' total'; })()", "badge": null}, {"slug": "investor", "label": "Investors", "icon": "target", "primary": "(function(){ var inv = (window.VYVE_DATA.investors && window.VYVE_DATA.investors.all) ? window.VYVE_DATA.investors.all().length : 0; return inv; })()", "secondary": "'tracked investors'", "badge": null}, {"slug": "partners", "label": "Partners", "icon": "link", "primary": "(function(){ var p = D.partners && D.partners.all ? D.partners.all().length : 0; return p; })()", "secondary": "'in network'", "badge": null}, {"slug": "invoicing", "label": "Invoicing", "icon": "file-text", "primary": "(function(){ var inv = D.invoicing && D.invoicing.all ? D.invoicing.all() : []; var unpaid = inv.filter(function(i){return (i.status||'').toLowerCase()!=='paid';}); return unpaid.length; })()", "secondary": "'unpaid invoices'", "badge": null}];
  var arrow = '<svg class="tile-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  function safe(fn){ try { return fn(); } catch(e){ console.warn('tile metric error', e); return ''; } }

  function renderTile(t){
    var icon = ICONS[t.icon] || '';
    var primary = safe(function(){ return eval(t.primary); }) || '—';
    var secondary = safe(function(){ return eval(t.secondary); }) || '';
    var badge = t.badge ? safe(function(){ return eval(t.badge); }) : '';
    return '<a class="hub-tile" href="#/' + t.slug + '">' +
      '<div class="tile-head">' +
        '<div class="tile-icon">' + icon + '</div>' +
        (badge || '') +
      '</div>' +
      '<div class="tile-label">' + t.label + '</div>' +
      '<div class="tile-metric-row">' +
        '<div class="tile-primary">' + primary + '</div>' +
        '<div class="tile-secondary">' + secondary + '</div>' +
      '</div>' +
      arrow +
    '</a>';
  }

  document.getElementById('hub-commercial-tiles').innerHTML = tiles.map(renderTile).join('');
})();
</script>
