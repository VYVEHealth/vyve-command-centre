<div class="page active" id="page-delivery">
  <div class="page-hero">
    <div class="eyebrow">Operational Backbone</div>
    <h1 class="page-title">Delivery</h1>
    <p class="page-sub">Sessions, tasks, compliance. What's happening, what's due, what's at risk.</p>
  </div>

  <div class="hub-tiles" id="hub-delivery-tiles"></div>

  <!-- Delivery signal -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px">
    <div class="card">
      <div class="card-header"><div class="card-title">Sessions this week</div><div class="card-sub" id="dlv-sess-sub">Loading…</div></div>
      <div id="dlv-sessions" class="card-body"></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Active clients</div><div class="card-sub" id="dlv-clients-sub">Loading…</div></div>
      <div id="dlv-clients" class="card-body"></div>
    </div>
  </div>
</div>

<style>
  .hub-tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-top: 8px;
  }
  @media (max-width: 1100px) { .hub-tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px)  { .hub-tiles { grid-template-columns: 1fr; } }

  .hub-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 22px 22px 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
    text-decoration: none;
    color: inherit;
    position: relative;
    min-height: 156px;
  }
  .hub-tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--vyve-teal-pale);
    color: inherit;
  }
  .hub-tile .tile-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .hub-tile .tile-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--r-md);
    background: var(--vyve-teal-pale);
    color: var(--vyve-teal);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hub-tile .tile-icon svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .hub-tile .tile-badge {
    font-size: var(--fs-xxs);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-wide);
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    flex-shrink: 0;
  }
  .hub-tile .tile-label {
    font-family: var(--font-head);
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1.2;
    margin-top: 2px;
  }
  .hub-tile .tile-metric-row {
    margin-top: auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-top: 4px;
  }
  .hub-tile .tile-primary {
    font-family: var(--font-head);
    font-size: var(--fs-2xl);
    font-weight: var(--fw-bold);
    color: var(--text);
    letter-spacing: var(--ls-tight);
    line-height: 1;
  }
  .hub-tile .tile-secondary {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    text-align: right;
    line-height: 1.3;
    max-width: 50%;
  }
  .hub-tile .tile-arrow {
    position: absolute;
    bottom: 18px;
    right: 18px;
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity var(--t-fast), transform var(--t-fast);
  }
  .hub-tile:hover .tile-arrow {
    opacity: 1;
    transform: translateX(2px);
    color: var(--vyve-teal);
  }
</style>

<script>
(function(){
  if (!window.VYVE_DATA) { console.error('[hub-delivery] VYVE_DATA not loaded'); return; }
  var D = window.VYVE_DATA;
  var ICONS = window.VYVE_ICONS || {};
  var tiles = [{"slug": "sessions", "label": "Sessions", "icon": "calendar", "primary": "D.sessions.thisWeek().length", "secondary": "'this week  \\u00b7  ' + D.sessions.todayAndTomorrow().length + ' in 48h'", "badge": null}, {"slug": "tasks", "label": "Tasks", "icon": "check-square", "primary": "D.tasks.activeCount()", "secondary": "(function(){ var o = D.tasks.overdue().length; return o ? o + ' overdue' : 'on track'; })()", "badge": "(function(){ var o = D.tasks.overdue().length; return o ? '<span class=\"tile-badge badge-red\">' + o + ' overdue</span>' : ''; })()"}, {"slug": "compliance", "label": "Compliance", "icon": "shield", "primary": "D.compliance.dueSoon(30).length", "secondary": "'due in 30d'", "badge": "(function(){ var u = D.compliance.dueSoon(7).length; return u ? '<span class=\"tile-badge badge-amber\">' + u + ' soon</span>' : ''; })()"}];
  var arrow = '<svg class="tile-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  function safe(fn){ try { return fn(); } catch(e){ console.warn('tile metric error', e); return ''; } }

  function renderTile(t){
    var icon = ICONS[t.icon] || '';
    var primary = safe(function(){ return eval(t.primary); }) || '—';
    var secondary = safe(function(){ return eval(t.secondary); }) || '';
    var badge = t.badge ? safe(function(){ return eval(t.badge); }) : '';
    return '<a class="hub-tile" href="#/' + t.slug + '">' +
      '<div class="tile-head">' +
        '<div class="tile-icon">' + icon + '</div>' +
        (badge || '') +
      '</div>' +
      '<div class="tile-label">' + t.label + '</div>' +
      '<div class="tile-metric-row">' +
        '<div class="tile-primary">' + primary + '</div>' +
        '<div class="tile-secondary">' + secondary + '</div>' +
      '</div>' +
      arrow +
    '</a>';
  }

  document.getElementById('hub-delivery-tiles').innerHTML = tiles.map(renderTile).join('');

  function renderSessionsThisWeek(){
    var all = D.sessions.all();
    var now = Date.now();
    var weekEnd = now + 7*86400000;
    var thisWeek = all.filter(function(s){
      var p = D.parseDate(s.date);
      return p && p.getTime() >= now && p.getTime() <= weekEnd;
    }).sort(function(a,b){
      return D.parseDate(a.date) - D.parseDate(b.date);
    });
    var sub = document.getElementById('dlv-sess-sub');
    if (!thisWeek.length){
      sub.textContent = 'None scheduled';
      document.getElementById('dlv-sessions').innerHTML = '<div class="empty" style="padding:24px 22px"><p>No sessions scheduled in the next 7 days.</p></div>';
      return;
    }
    sub.textContent = thisWeek.length + ' upcoming';
    document.getElementById('dlv-sessions').innerHTML = thisWeek.slice(0, 7).map(function(s){
      var p = D.parseDate(s.date);
      var pillarColor = { 'physical':'var(--vyve-gold)','mental':'var(--vyve-teal)','social':'var(--vyve-coral)' }[(s.pillar||'').toLowerCase()] || 'var(--text-muted)';
      return '<a class="list-row" href="#/sessions" style="padding:12px 22px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;display:flex;align-items:center;gap:10px">' +
        '<div style="width:6px;height:36px;background:' + pillarColor + ';border-radius:3px;flex-shrink:0"></div>' +
        '<div class="list-row-main">' +
          '<div class="list-row-title">' + (s.title || 'Session') + '</div>' +
          '<div class="list-row-sub">' + (s.client || '') + (s.facilitator ? ' \u00b7 ' + s.facilitator : '') + '</div>' +
        '</div>' +
        '<div class="list-row-meta" style="font-size:11px;color:var(--text-muted);text-align:right">' +
          (p ? p.toLocaleDateString('en-GB', { weekday:'short', day:'numeric' }) : '') +
          (s.time ? '<br>' + s.time : '') +
        '</div>' +
      '</a>';
    }).join('');
  }

  function renderActiveClients(){
    var live = D.clients.live ? D.clients.live() : [];
    var sub = document.getElementById('dlv-clients-sub');
    if (!live.length){
      sub.textContent = 'No active clients';
      document.getElementById('dlv-clients').innerHTML = '<div class="empty" style="padding:24px 22px"><p>No clients in "live" stage. Add or update clients on the Clients page.</p></div>';
      return;
    }
    sub.textContent = live.length + ' live';
    document.getElementById('dlv-clients').innerHTML = live.slice(0, 7).map(function(c){
      return '<a class="list-row" href="#/clients" style="padding:12px 22px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit">' +
        '<div class="list-row-main">' +
          '<div class="list-row-title">' + (c.name || c.company || 'Client') + '</div>' +
          '<div class="list-row-sub">' + (c.programme || c.notes || '') + '</div>' +
        '</div>' +
      '</a>';
    }).join('');
  }

  renderSessionsThisWeek();
  renderActiveClients();
})();
</script>
