<div class="page active" id="page-brief">
  <div class="page-header">
    <div>
      <div class="page-title">Morning Brief</div>
      <div class="page-sub" id="brief-date"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="brief-refresh" type="button">Refresh</button>
    </div>
  </div>

  <!-- KPIs row -->
  <div class="grid-4 stats-row" id="brief-kpis"></div>

  <!-- Two-column body -->
  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px" id="brief-grid">
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="card">
        <div class="card-header"><div class="card-title">Today's priorities</div><div class="card-sub" id="brief-task-count"></div></div>
        <div id="brief-tasks" class="card-body"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Closing this month</div><div class="card-sub" id="brief-deal-count"></div></div>
        <div id="brief-deals" class="card-body"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Sessions today & tomorrow</div><div class="card-sub" id="brief-sess-count"></div></div>
        <div id="brief-sessions" class="card-body"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="card">
        <div class="card-header"><div class="card-title">Compliance due</div><div class="card-sub">Next 30 days</div></div>
        <div id="brief-compliance" class="card-body"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Action plans</div><div class="card-sub" id="brief-ap-sub">Overdue &amp; due this fortnight</div></div>
        <div id="brief-actions" class="card-body"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Fresh intel</div><div class="card-sub">Latest signals</div></div>
        <div id="brief-intel" class="card-body"></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Recent activity</div><div class="card-sub">Across the hub</div></div>
        <div id="brief-activity" class="card-body"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  if (!window.VYVE_DATA) { console.error('[Brief] VYVE_DATA not loaded'); return; }
  var D = window.VYVE_DATA;

  function el(id){ return document.getElementById(id); }
  function empty(msg){ return '<div class="empty" style="padding:18px 0;font-size:13px">' + msg + '</div>'; }

  function setDate(){
    var d = new Date();
    var opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
    el('brief-date').textContent = d.toLocaleDateString('en-GB', opts);
  }

  function renderKPIs(){
    var perf30 = D.performance.totalReach(30);
    var mrr = D.finance.mrr();
    var pipeline = D.deals.pipelineValue();
    var apPct = D.actions.completionPct();
    var apOverdue = D.actions.overdue().length;

    var kpis = [
      { label: '30-day reach', value: D.fmt(perf30), sub: 'across LinkedIn, IG, FB' },
      { label: 'MRR', value: D.fmtGBP(mrr), sub: mrr ? 'latest snapshot' : 'add in Finance' },
      { label: 'Action plans', value: (apPct != null ? apPct : 0) + '%', sub: apOverdue ? apOverdue + ' overdue' : 'complete across the team' },
      { label: 'Pipeline', value: D.fmtGBP(pipeline), sub: pipeline ? 'open deals' : 'no deals yet' }
    ];

    el('brief-kpis').innerHTML = kpis.map(function(k){
      return '<div class="stat"><div class="stat-num">' + k.value + '</div><div class="stat-label">' + k.label + '</div><div class="stat-sub">' + k.sub + '</div></div>';
    }).join('');
  }

  function renderTasks(){
    var items = D.tasks.todayOrOverdue();
    el('brief-task-count').textContent = items.length + ' due';
    if (!items.length) { el('brief-tasks').innerHTML = empty('No tasks due today. Add some in Tasks.'); return; }
    el('brief-tasks').innerHTML = items.slice(0, 6).map(function(t){
      var d = D.parseDate(t.due);
      var overdue = d && d < D.startOfDay();
      var dateStr = d ? d.toLocaleDateString('en-GB', { day:'numeric', month:'short'}) : '';
      var priority = (t.priority||'').toLowerCase();
      var pColor = priority === 'high' ? '#e06060' : priority === 'medium' ? 'var(--vyve-gold)' : 'var(--text-muted)';
      return '<div class="list-row" data-route="#/tasks" style="cursor:pointer">' +
        '<div class="list-row-main"><div class="list-row-title">' + (t.title || 'Untitled') + '</div>' +
        '<div class="list-row-sub">' + (t.owner ? t.owner + ' · ' : '') + '<span style="color:' + (overdue ? '#e06060' : 'var(--text-muted)') + '">' + (overdue ? 'Overdue · ' : '') + dateStr + '</span></div></div>' +
        (priority ? '<span class="badge" style="background:' + pColor + '22;color:' + pColor + '">' + priority + '</span>' : '') +
      '</div>';
    }).join('');
  }

  function renderDeals(){
    var items = D.deals.closingSoon();
    el('brief-deal-count').textContent = items.length ? D.fmtGBP(items.reduce(function(s,d){return s+(Number(d.value)||0);},0)) : '';
    if (!items.length) { el('brief-deals').innerHTML = empty('No deals closing this month. Manage in CRM.'); return; }
    el('brief-deals').innerHTML = items.slice(0, 5).map(function(d){
      return '<div class="list-row" data-route="#/crm" style="cursor:pointer">' +
        '<div class="list-row-main"><div class="list-row-title">' + (d.company || d.title || 'Deal') + '</div>' +
        '<div class="list-row-sub">' + (d.stage || '') + (d.expected_close ? ' · ' + new Date(d.expected_close).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '') + '</div></div>' +
        '<span class="stat-mini">' + D.fmtGBP(Number(d.value)||0) + '</span>' +
      '</div>';
    }).join('');
  }

  function renderSessions(){
    var items = D.sessions.todayAndTomorrow();
    el('brief-sess-count').textContent = items.length ? items.length + ' upcoming' : '';
    if (!items.length) { el('brief-sessions').innerHTML = empty('No sessions today or tomorrow. Schedule in Sessions.'); return; }
    el('brief-sessions').innerHTML = items.map(function(s){
      var d = D.parseDate(s.date);
      var time = d ? d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
      var isToday = d && d.toDateString() === new Date().toDateString();
      return '<div class="list-row" data-route="#/sessions" style="cursor:pointer">' +
        '<div class="list-row-main"><div class="list-row-title">' + (s.title || 'Session') + '</div>' +
        '<div class="list-row-sub">' + (s.client || s.attendees || '') + ' · ' + (isToday ? 'Today' : 'Tomorrow') + ' ' + time + '</div></div>' +
      '</div>';
    }).join('');
  }

  function renderCompliance(){
    var items = D.compliance.dueSoon(30);
    if (!items.length) { el('brief-compliance').innerHTML = empty('Nothing due in the next 30 days.'); return; }
    el('brief-compliance').innerHTML = items.slice(0, 5).map(function(c){
      var d = D.parseDate(c.due);
      var days = d ? Math.ceil((d - Date.now()) / 86400000) : null;
      var color = days != null && days <= 7 ? '#e06060' : days != null && days <= 14 ? 'var(--vyve-gold)' : 'var(--text-muted)';
      return '<div class="list-row" data-route="#/compliance" style="cursor:pointer">' +
        '<div class="list-row-main"><div class="list-row-title">' + (c.title || c.area || 'Item') + '</div>' +
        '<div class="list-row-sub">' + (c.area || '') + '</div></div>' +
        '<span class="badge" style="background:' + color + '22;color:' + color + '">' + (days != null ? (days <= 0 ? 'overdue' : days + 'd') : '—') + '</span>' +
      '</div>';
    }).join('');
  }

  function renderActions(){
    var overdue = D.actions.overdue();
    var soon = D.actions.dueSoon(14);
    // Dedupe (overdue items can technically also appear in dueSoon if due=today but that's filtered out by our dueSoon impl)
    var items = overdue.concat(soon);
    // Sort: overdue first (most overdue at top), then due-soon (soonest at top)
    items.sort(function(a, b){
      var aOver = (function(){ var d = D.parseDate(a.due); return d && d < D.startOfDay(); })();
      var bOver = (function(){ var d = D.parseDate(b.due); return d && d < D.startOfDay(); })();
      if (aOver && !bOver) return -1;
      if (!aOver && bOver) return 1;
      return D.parseDate(a.due) - D.parseDate(b.due);
    });

    var subEl = document.getElementById('brief-ap-sub');
    if (subEl) subEl.textContent = overdue.length + ' overdue \u00b7 ' + soon.length + ' due in 14d';

    if (!items.length) {
      el('brief-actions').innerHTML = empty('No overdue or upcoming actions \u2014 add deadlines in Action Plans.');
      return;
    }

    el('brief-actions').innerHTML = items.slice(0, 6).map(function(a){
      var d = D.parseDate(a.due);
      var today = D.startOfDay();
      var isOverdue = d && d < today;
      var days = d ? Math.ceil((d - today) / 86400000) : null;
      var dateStr = d ? d.toLocaleDateString('en-GB', { day:'numeric', month:'short'}) : '';
      var badgeText = isOverdue ? Math.abs(days) + 'd over' : (days === 0 ? 'today' : days + 'd');
      var badgeColor = isOverdue ? '#e06060' : (days != null && days <= 7) ? 'var(--vyve-gold)' : 'var(--vyve-teal-light)';
      var memberInitial = (a.member_name || '?').charAt(0);
      var truncated = (a.text || '').length > 90 ? (a.text || '').slice(0, 88) + '\u2026' : (a.text || '');
      return '<div class="list-row" data-route="#/action-plans" style="cursor:pointer">' +
        '<div class="list-row-main">' +
          '<div class="list-row-title">' +
            '<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--vyve-teal-dark);color:var(--text);font-size:10px;font-weight:700;text-align:center;line-height:18px;margin-right:8px;font-family:var(--font-head)">' + memberInitial + '</span>' +
            truncated +
          '</div>' +
          '<div class="list-row-sub">' + (a.member_name || '') + ' \u00b7 ' + dateStr + '</div>' +
        '</div>' +
        '<span class="badge" style="background:' + badgeColor + '22;color:' + badgeColor + '">' + badgeText + '</span>' +
      '</div>';
    }).join('');
  }

  function renderIntel(){
    var intel = D.intel.recent(3);
    var comp = D.competitors.recent(2);
    var combined = intel.concat(comp).sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); }).slice(0, 5);
    if (!combined.length) { el('brief-intel').innerHTML = empty('No fresh intel yet. Add in Research/Grants or Competitors, or pull from the Intel Hub.'); return; }
    el('brief-intel').innerHTML = combined.map(function(i){
      return '<div class="list-row">' +
        '<div class="list-row-main"><div class="list-row-title">' + (i.title || 'Signal') + '</div>' +
        '<div class="list-row-sub">' + (i.type || i.source || '') + (i.created_at ? ' · ' + D.relTime(new Date(i.created_at)) : '') + '</div></div>' +
      '</div>';
    }).join('');
  }

  function renderActivity(){
    var items = D.activity(6);
    if (!items.length) { el('brief-activity').innerHTML = empty('No activity yet — start adding tasks, deals, or content.'); return; }
    var iconFor = { task:'✓', deal:'£', session:'📅', content:'✎', podcast:'🎙', client:'◐', compliance:'⚖' };
    el('brief-activity').innerHTML = items.map(function(i){
      return '<div class="list-row">' +
        '<div class="list-row-main"><div class="list-row-title">' + (iconFor[i.type]||'•') + ' ' + i.title + '</div>' +
        '<div class="list-row-sub">' + i.type + ' · ' + D.relTime(i.date) + '</div></div>' +
      '</div>';
    }).join('');
  }

  function wireRowClicks(){
    document.querySelectorAll('#page-brief [data-route]').forEach(function(row){
      row.addEventListener('click', function(){
        var route = row.getAttribute('data-route');
        if (route) window.location.hash = route;
      });
    });
  }

  function renderAll(){
    setDate();
    renderKPIs();
    renderTasks();
    renderDeals();
    renderSessions();
    renderCompliance();
    renderActions();
    renderIntel();
    renderActivity();
    wireRowClicks();
  }

  el('brief-refresh').addEventListener('click', renderAll);
  renderAll();
})();
</script>
